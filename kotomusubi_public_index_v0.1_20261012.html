<!doctype html>
<html lang="ja" data-theme="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>ことむすび KOTOMUSUBI</title>
<meta name="description" content="ことばを えらんで つたえる。Words that connect.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f8fb; --panel:#ffffff; --ink:#18202b; --sub:#4a5668; --line:#c9d3e0;
  --accent:#1f4e79; --accent-ink:#ffffff; --hot:#b3261e; --ok:#1b6e3c; --focus:#ff9800;
  --tile:#eef4fb; --tile-sel:#d6e6f8; --tile-min:64px;
}
:root[data-theme="high"]{
  --bg:#000; --panel:#000; --ink:#fff; --sub:#ffeb3b; --line:#fff;
  --accent:#ffeb3b; --accent-ink:#000; --hot:#ff8a80; --ok:#69f0ae; --focus:#00e5ff;
  --tile:#111; --tile-sel:#333;
}
*{box-sizing:border-box}
html{font-size:20px}
html[data-size="M"]{font-size:16px}
html[data-size="XL"]{font-size:26px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  line-height:1.5;word-break:auto-phrase;overflow-wrap:break-word;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
ruby rt{font-size:.5em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:flex;flex-direction:column;height:100dvh}
header.top{display:flex;gap:.4rem;align-items:center;padding:.4rem .6rem;background:var(--accent);color:var(--accent-ink);flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0 .4rem 0 0;white-space:nowrap}
header.top h1 small{font-weight:normal;font-size:.6em;opacity:.85;margin-left:.3em}
.sp{flex:1}
.hbtn{border:2px solid var(--accent-ink);background:transparent;color:var(--accent-ink);border-radius:.6rem;padding:.3rem .7rem;min-height:44px;font-weight:600}
.hbtn[aria-pressed="true"],.hbtn[aria-expanded="true"]{background:var(--accent-ink);color:var(--accent)}
.hbtn.attn{background:#ffeb3b;color:#000;border-color:#ffeb3b}
.hbtn.help{background:#fff;color:var(--hot);border-color:#fff}
:root[data-theme="high"] .hbtn.help{color:#000;background:#ff8a80;border-color:#ff8a80}
main{flex:1;min-height:0;display:grid;gap:.5rem;padding:.5rem}
main.d3{grid-template-columns:minmax(200px,260px) 1fr minmax(280px,380px)}
main.t2l{grid-template-columns:1fr minmax(260px,380px)}
main.t2p{grid-template-rows:auto 1fr}
main.p1{grid-template-columns:1fr;padding:.4rem;padding-bottom:0}
.pane{background:var(--panel);border:2px solid var(--line);border-radius:.8rem;padding:.6rem;overflow:auto;min-height:0}
.pane h2{font-size:.8rem;margin:.2rem 0 .3rem;color:var(--sub);font-weight:700}
.list{display:flex;flex-direction:column;gap:.35rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:2px solid var(--line);background:var(--tile);border-radius:.6rem;padding:.35rem .7rem;min-height:44px;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.nav{display:flex;flex-direction:column;gap:.6rem}
.grid{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(var(--tile-min)*3.6)),1fr))}
.tile{display:flex;align-items:center;gap:.5rem;min-height:calc(var(--tile-min) + .6rem);border:2px solid var(--line);background:var(--tile);border-radius:.8rem;padding:.5rem .7rem;text-align:left;position:relative}
.tile .ic{font-size:1.6em;flex:none;line-height:1}
.tile .tx{flex:1;min-width:0}
.tile .lv{position:absolute;right:.5rem;top:.2rem;font-size:.55rem;color:var(--sub);letter-spacing:.1em}
.tile .num{position:absolute;left:.4rem;top:.1rem;font-size:.55rem;color:var(--sub)}
.tile[aria-pressed="true"]{background:var(--tile-sel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.pager{display:flex;gap:.4rem;align-items:center;margin:.5rem 0 0}
.pager .pg{color:var(--sub);flex:1;text-align:center}
.btn{border:2px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:.7rem;padding:.4rem .9rem;min-height:48px;font-weight:700}
:root[data-theme="high"] .btn{color:var(--ink);border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--hot);color:var(--hot)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.small{min-height:40px;padding:.2rem .6rem;font-size:.85rem}
.sentence{font-size:1.6rem;font-weight:700;min-height:6rem;padding:.6rem;border:3px dashed var(--line);border-radius:.8rem;margin:.3rem 0 .6rem;display:flex;gap:.5rem;align-items:center}
.sentence.empty{color:var(--sub);font-weight:400;font-size:1rem}
.sentence .ic{font-size:1.4em}
.row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.3rem 0}
.row .btn.big{flex:1;font-size:1.2rem;min-height:60px}
.hold{position:relative;overflow:hidden}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--focus)}
.hold.holding::after{width:100%;transition:width var(--hold,800ms) linear}
.note{font-size:.8rem;color:var(--sub)}
.warn{border:2px solid var(--hot);border-radius:.6rem;padding:.4rem .6rem;font-size:.85rem}
.bar{display:none}
main.p1 ~ .bar,.bar.on{display:flex;gap:.4rem;padding:.4rem;padding-bottom:calc(.4rem + env(safe-area-inset-bottom));background:var(--panel);border-top:2px solid var(--line)}
.bar .btn{flex:1;min-height:56px;white-space:nowrap;padding:.4rem .3rem;font-size:.85rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:.5rem}
.sheet{min-width:0;background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:1rem;max-width:760px;width:100%;max-height:94dvh;overflow:auto;padding:.8rem}
.sheet h2{margin:.1rem 0 .5rem;font-size:1.1rem}
.sheet .hd{display:flex;align-items:center;gap:.5rem}
.sheet .hd h2{flex:1}
.full{position:fixed;inset:0;z-index:70;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;text-align:center}
.full .big{font-size:min(14vw,6rem);font-weight:800;line-height:1.3}
.full.attn{animation:flash .8s steps(2) infinite}
@keyframes flash{50%{background:#ffeb3b;color:#000}}
@media (prefers-reduced-motion:reduce){.full.attn{animation:none;background:#ffeb3b;color:#000}}
label.f{display:block;margin:.5rem 0 .15rem;font-weight:700;font-size:.85rem}
select,input[type=text],input[type=tel],input[type=email],textarea{font:inherit;width:100%;padding:.4rem .5rem;min-height:44px;border:2px solid var(--line);border-radius:.5rem;background:var(--panel);color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
.two>*{min-width:0}
@media (max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
details{margin:.5rem 0;border:1px solid var(--line);border-radius:.6rem;padding:.3rem .6rem}
summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.item{display:flex;gap:.3rem;align-items:stretch;margin-bottom:.4rem}
.item .tile{flex:1}
.item .ctl{display:flex;flex-direction:column;gap:.2rem}
@media (max-width:640px){
  header.top{gap:.25rem;padding:.3rem .4rem}
  header.top h1{font-size:.95rem;margin:0}
  header.top h1 small{display:none}
  .hbtn{min-height:44px;padding:.2rem .45rem;font-size:.72rem}
  header.top .sp{display:none}
  .pane{padding:.4rem}
}
#printArea{display:none}
@media print{
  #app,.overlay,.full{display:none!important}
  body{background:#fff;color:#000}
  #printArea{display:block}
  #printArea h1{font-size:14pt;margin:0 0 6mm}
  #printArea .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  #printArea .pc{border:2px solid #000;border-radius:3mm;padding:5mm;min-height:40mm;font-size:18pt;font-weight:700;display:flex;gap:3mm;align-items:center;break-inside:avoid}
  #printArea .pc span.ic{font-size:26pt}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" aria-hidden="true"></div>
<div id="live" class="sr" role="status" aria-live="polite"></div>

<script>
"use strict";
const VERSION="0.1", VARIANT="public";

/* ---------- 文言（日本語／English） ---------- */
const T={
ja:{
 app:"ことむすび",tag:"Words that connect.",role:"たちば",scene:"ばめん",intent:"なにを したい？",level:"つよさ",
 lv:["ぜんぶ","ひかえめ","ふつう","つよい"],speak:"はなす",stop:"とめる",show:"みせる",send:"おくる",
 addTo:"ことば帖に入れる",clear:"けす",attn:"よびかけ",help:"たすけを よぶ",fav:"ことば帖",set:"せってい",
 back:"もどる",next:"つぎ",prev:"まえ",close:"とじる",empty:"ひょうげんを えらんでください",
 hold:"ながおし",holdTip:"ボタンを おしたまま まってください",
 emergency:"ことむすびは 緊急通報サービスでは ありません。24時間 見守りません。自動では 通報しません。ボタンを おしたときだけ、登録した人に つなぎます。",
 callTitle:"たすけを よぶ",callNone:"よぶ相手が 登録されていません。せっていで 登録してください。",
 call:"でんわ",sms:"SMS",mail:"メール",

 attnText:"よんでいます",attnSub:"ちかくの人は きて ください",
 shown:"みせる",noTTS:"この端末では 音声が つかえません。画面を みせてください。",
 shareDone:"おくる画面を ひらきました",copied:"コピーしました",
 settings:"せってい",lang:"ことば（言語）",script:"もじ",scripts:{hira:"ひらがな",kanji:"漢字かな",ruby:"漢字＋ふりがな"},
 device:"つかう端末",devs:{desktop:"デスクトップ",laptop:"ラップトップ",tablet:"タブレット",phone:"スマートフォン"},
 devAuto:"自動で えらぶ",size:"もじの 大きさ",theme:"配色",themes:{normal:"ふつう",high:"ハイコントラスト"},
 icons:"アイコンを 出す",confirm:"はなす前に 確認する",rate:"はなす はやさ",perPage:"候補の数",volume:"よびかけの 音",
 vols:["小","中","大"],auto:"自動",contacts:"たすけを よぶ 相手（この端末にだけ 保存）",cName:"名前",cTel:"電話番号",cSms:"SMS の宛先",cMail:"メール",
 data:"書き出し・読み込み",exportJson:"JSON で 書き出す",exportCsv:"CSV で 書き出す",inclContacts:"よぶ相手も 含める",
 importF:"ファイルを 読み込む",replace:"置きかえる",append:"追加する",imported:"読み込みました",importErr:"読み込めませんでした",
 about:"このアプリについて",privacy:"入力した文や登録した内容は、この端末の中だけに 保存されます。外部には 送りません。",
 heavyNote:"大切な ひょうげんです。ボタンを ながおしして ください。",
 newBook:"新しい帖",bookName:"帖の名前",rename:"名前を かえる",delBook:"帖を けす",edit:"へんしゅう",done:"おわり",
 addPhrase:"ことばを 足す",phText:"ことば（漢字[よみ] でも 可）",phYomi:"よみ（空なら そのまま）",phEn:"English（あれば）",save:"ほぞん",
 freq:"よく使った",print:"印刷",del:"けす",up:"上へ",down:"下へ",noItems:"まだ ありません。",
 defBook:"わたしの ことば帖",confirmDel:"本当に けしますか？",loading:"よみこみ中…",loadErr:"辞書を 読み込めませんでした。公開URLから ひらくか、private 版を つかってください。",
 pickRole:"たちばを えらぶ",page:"ページ",showClose:"がめんを タップすると もどります",
 helpMore:"せつめい"
},
en:{
 app:"KOTOMUSUBI",tag:"Words that connect.",role:"Who",scene:"Where",intent:"What for",level:"Strength",
 lv:["All","Gentle","Normal","Strong"],speak:"Speak",stop:"Stop",show:"Show",send:"Send",
 addTo:"Add to phrasebook",clear:"Clear",attn:"Get attention",help:"Call for help",fav:"Phrasebook",set:"Settings",
 back:"Back",next:"Next",prev:"Prev",close:"Close",empty:"Choose an expression",
 hold:"Hold",holdTip:"Press and hold the button",
 emergency:"KOTOMUSUBI is not an emergency service. It does not watch over you 24 hours and never calls anyone automatically. It only connects to the people you registered when you press the button.",
 callTitle:"Call for help",callNone:"No contacts yet. Add them in Settings.",
 call:"Call",sms:"SMS",mail:"Email",
 windows:"Text-based emergency reporting for people who cannot speak (such as Net110 and Net119) may need advance registration and differs by region. Please check with your local police or fire department. (Details will be added in a later version.)",
 attnText:"Calling you",attnSub:"Please come over",
 shown:"Show",noTTS:"Speech is not available on this device. Please show the screen.",
 shareDone:"Share sheet opened",copied:"Copied",
 settings:"Settings",lang:"Language",script:"Japanese text",scripts:{hira:"Hiragana",kanji:"Kanji + kana",ruby:"Kanji + furigana"},
 device:"Device",devs:{desktop:"Desktop",laptop:"Laptop",tablet:"Tablet",phone:"Smartphone"},
 devAuto:"Choose automatically",size:"Text size",theme:"Colors",themes:{normal:"Normal",high:"High contrast"},
 icons:"Show icons",confirm:"Confirm before speaking",rate:"Speech speed",perPage:"Choices per page",volume:"Attention sound",
 vols:["Low","Mid","High"],auto:"Auto",contacts:"People to call for help (stored on this device only)",cName:"Name",cTel:"Phone",cSms:"SMS number",cMail:"Email",
 data:"Export / Import",exportJson:"Export as JSON",exportCsv:"Export as CSV",inclContacts:"Include help contacts",
 importF:"Import a file",replace:"Replace",append:"Append",imported:"Imported",importErr:"Could not import",
 about:"About",privacy:"Everything you type or register stays on this device. Nothing is sent out.",
 heavyNote:"This is an important expression. Press and hold the button.",
 newBook:"New book",bookName:"Book name",rename:"Rename",delBook:"Delete book",edit:"Edit",done:"Done",
 addPhrase:"Add phrase",phText:"Text (kanji[reading] allowed)",phYomi:"Reading (blank = as typed)",phEn:"English (optional)",save:"Save",
 freq:"Most used",print:"Print",del:"Delete",up:"Up",down:"Down",noItems:"Nothing yet.",
 defBook:"My phrasebook",confirmDel:"Delete it?",loading:"Loading…",loadErr:"Could not load the dictionary. Open the public URL or use the private build.",
 pickRole:"Choose who you are",page:"Page",showClose:"Tap the screen to go back",
 helpMore:"Details"
}};

/* ---------- 保存 ---------- */
const mem={};
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
};
const DEF_PROFILE={lang:"ja",script:"hira",size:"L",theme:"normal",icons:true,confirm:true,rate:0.9,perPage:"auto",volume:1,role:"highschool"};
let P=Object.assign({},DEF_PROFILE,store.get("km.profile",{}));
let DEV=store.get("km.device",{type:null,auto:true});
let BOOKS=store.get("km.books",null);
let CONTACTS=store.get("km.contacts",[]);
let USAGE=store.get("km.usage",{});
const saveProfile=()=>store.set("km.profile",P);
const saveDev=()=>store.set("km.device",DEV);
const saveBooks=()=>store.set("km.books",BOOKS);
const saveContacts=()=>store.set("km.contacts",CONTACTS);
const saveUsage=()=>store.set("km.usage",USAGE);

/* ---------- ユーティリティ ---------- */
const t=k=>T[P.lang][k];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KANJI=/([一-鿿々〆ヶ]+)\[([^\]]+)\]/g;
const stripRuby=s=>String(s).replace(/\[[^\]]*\]/g,"");
const readingOf=s=>String(s).replace(KANJI,"$2").replace(/\[[^\]]*\]/g,"");
const rubyHTML=s=>esc(s).replace(KANJI,"<ruby>$1<rt>$2</rt></ruby>").replace(/\[[^\]]*\]/g,"");
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
/* 表示：obj は {hira, ruby, en} */
function disp(o){
  if(P.lang==="en") return esc(o.en||stripRuby(o.ruby||o.hira));
  if(P.script==="hira") return esc(o.hira);
  if(P.script==="kanji") return esc(stripRuby(o.ruby));
  return rubyHTML(o.ruby);
}
function plain(o){
  if(P.lang==="en") return o.en||stripRuby(o.ruby||o.hira);
  if(P.script==="hira") return o.hira;
  return stripRuby(o.ruby);
}
function speakText(o){return P.lang==="en"?(o.en||""):o.hira}
const say=m=>{const l=document.getElementById("live");if(l){l.textContent="";setTimeout(()=>l.textContent=m,30)}};

/* ---------- 端末プロファイル ---------- */
function detectDevice(){
  const coarse=matchMedia("(pointer:coarse)").matches;
  const w=innerWidth,h=innerHeight,m=Math.min(w,h);
  if(coarse) return m<600?"phone":"tablet";
  return w>=1700?"desktop":"laptop";
}
function devType(){return DEV.auto||!DEV.type?detectDevice():DEV.type}
function layoutOf(){
  const d=devType();
  if(d==="phone") return "p1";
  if(d==="tablet") return innerWidth>=innerHeight?"t2l":"t2p";
  return "d3";
}
function perPage(){
  if(P.perPage!=="auto") return +P.perPage;
  const d=devType(); return d==="phone"?4:d==="tablet"?8:12;
}
function tileMin(){const d=devType();return d==="phone"?72:d==="tablet"?96:64}

/* ---------- 辞書 ---------- */
let INDEX=null; const CACHE={};
async function loadIndex(){
  if(window.__KM) return window.__KM.index;
  const r=await fetch("data/index.json"); if(!r.ok) throw new Error("index"); return r.json();
}
async function loadRole(id){
  if(CACHE[id]) return;
  let j;
  if(window.__KM) j=window.__KM.dicts[id];
  else{const r=await fetch(`data/dict_${id}.json`); if(!r.ok) throw new Error("dict"); j=await r.json()}
  CACHE[id]=j.rows.map(r=>({id:r[0],scene:r[1],intent:r[2],level:r[3],hira:r[4],ruby:r[5],en:r[6],icon:r[7],role:id}));
}
const roleObj=id=>INDEX.roles.find(r=>r.id===id);
const scenesOf=id=>INDEX.scenes.filter(s=>s.role===id);
const label=o=>disp({hira:o.hira,ruby:o.ruby,en:o.en});
const isHeavy=e=>e&&((e.intent==="trouble"&&e.level===3)||(e.role==="counsel"&&(e.level===3||e.intent==="trouble"||e.intent==="feeling")));

/* ---------- 状態 ---------- */
const S={open:{},scene:null,intent:"request",level:0,page:0,step:"scene",sel:null,panel:null,book:null,edit:false,form:false,speaking:false,loading:true,err:false,msg:""};
let attnTimer=null,audioCtx=null,holdTimer=null;

/* ---------- 帖 ---------- */
function ensureBooks(){
  if(!BOOKS||!BOOKS.length){BOOKS=[{id:uid(),name:T.ja.defBook,items:[]}];saveBooks()}
  if(!S.book||!BOOKS.find(b=>b.id===S.book)) S.book=BOOKS[0].id;
}
const curBook=()=>BOOKS.find(b=>b.id===S.book);
function itemFromSel(e){return {id:uid(),hira:e.hira,ruby:e.ruby,en:e.en||"",intent:e.intent||"",scene:e.scene||"",icon:e.icon||"💬",count:0,created:today()}}
function addToBook(e){
  ensureBooks(); const b=curBook();
  if(b.items.some(i=>i.hira===e.hira&&i.ruby===e.ruby)){say("すでに はいっています");return false}
  b.items.push(itemFromSel(e)); saveBooks(); return true;
}

/* ---------- 音声 ---------- */
let voices=[];
function refreshVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]}}
if("speechSynthesis" in window){refreshVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",refreshVoices)}
const ttsOK=()=>"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
function speak(e){
  if(!e) return;
  recordUse(e);
  if(!ttsOK()){S.panel="show";S.msg=t("noTTS");render();return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speakText(e));
    const lang=P.lang==="en"?"en-US":"ja-JP"; u.lang=lang; u.rate=+P.rate;
    const v=voices.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase().startsWith(lang.slice(0,2).toLowerCase())&&v.lang.toLowerCase().includes(lang.slice(3).toLowerCase()))||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.slice(0,2)));
    if(v) u.voice=v;
    u.onstart=()=>{S.speaking=true;render()};
    u.onend=u.onerror=()=>{S.speaking=false;render()};
    S.speaking=true; speechSynthesis.speak(u);
  }catch(err){S.panel="show";S.msg=t("noTTS")}
  render();
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){} S.speaking=false;render()}
function recordUse(e){
  const key=e.role&&e.id&&!e.fromBook?e.id:(e.fromBook||null);
  if(e.fromBook){const b=BOOKS.find(b=>b.items.some(i=>i.id===e.fromBook));const it=b&&b.items.find(i=>i.id===e.fromBook);if(it){it.count=(it.count||0)+1;saveBooks()}}
  if(!key) return;

/* ---------- よびかけの音 ---------- */
function startAttn(){
  S.panel="attn"; render();
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume&&audioCtx.resume();
    const g=audioCtx.createGain(); g.gain.value=[0.25,0.5,0.9][P.volume]||0.5; g.connect(audioCtx.destination);
    let n=0;
    const beep=()=>{
      const o=audioCtx.createOscillator(); o.type="square"; o.frequency.value=n++%2?660:880;
      o.connect(g); o.start(); o.stop(audioCtx.currentTime+0.28);
    };
    beep(); clearInterval(attnTimer); const started=Date.now();
    attnTimer=setInterval(()=>{beep(); if(Date.now()-started>60000) stopAttn()},600);
    window._attnGain=g;
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([300,200,300,200,300]);
}
function stopAttn(){clearInterval(attnTimer);attnTimer=null;try{window._attnGain&&window._attnGain.disconnect()}catch(e){} if(navigator.vibrate)navigator.vibrate(0); if(S.panel==="attn"){S.panel=null;render()}}

function download(name,text,type){
  const b=new Blob([text],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const stamp=()=>today().replace(/-/g,"");
function exportJson(withContacts){
  const o={app:"kotomusubi",version:VERSION,exportedAt:today(),lang:P.lang,
    userProfiles:[Object.assign({},P)],kotobacho:BOOKS,
    ...(withContacts?{helpContacts:CONTACTS}:{})};
  download(`kotomusubi_data_${stamp()}.json`,JSON.stringify(o,null,1),"application/json");
}
function csvCell(s){s=String(s??"");return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){
  const rows=[["帖","表示する文","よみ","English","意図","場面"]];
  BOOKS.forEach(b=>b.items.forEach(i=>rows.push([b.name,i.ruby,i.hira,i.en,i.intent,i.scene])));
  download(`kotomusubi_kotobacho_${stamp()}.csv`,"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv");
}
function parseCsv(s){
  s=s.replace(/^﻿/,""); const out=[]; let row=[],cell="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"') q=true;
    else if(c===",") {row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&s[i+1]==="\n") i++; row.push(cell);cell="";out.push(row);row=[] }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);out.push(row)}
  return out.filter(r=>r.some(x=>x!==""));
}
function mergeBooks(incoming,mode){
  if(mode==="replace") BOOKS=[];
  incoming.forEach(nb=>{
    let b=BOOKS.find(x=>x.name===nb.name);
    if(!b){b={id:uid(),name:nb.name,items:[]};BOOKS.push(b)}
    (nb.items||[]).forEach(it=>{
      if(!it.ruby&&!it.hira) return;
      const hira=it.hira||readingOf(it.ruby), ruby=it.ruby||it.hira;
      if(b.items.some(x=>x.hira===hira&&x.ruby===ruby)) return;
      b.items.push({id:uid(),hira,ruby,en:it.en||"",intent:it.intent||"",scene:it.scene||"",icon:it.icon||"💬",count:it.count||0,created:it.created||today()});
    });
  });
  ensureBooks(); saveBooks();
}
async function importFile(file,mode){
  try{
    const txt=await file.text(); let books;
    if(/\.csv$/i.test(file.name)){
      const rows=parseCsv(txt).slice(1); const m={};
      rows.forEach(r=>{const [bn,ruby,hira,en,intent,scene]=r; if(!bn||!ruby) return; (m[bn]=m[bn]||{name:bn,items:[]}).items.push({ruby,hira:hira||readingOf(ruby),en,intent,scene})});
      books=Object.values(m);
    }else{
      const o=JSON.parse(txt); if(o.app!=="kotomusubi") throw new Error("app");
      books=o.kotobacho||[];
      if(o.helpContacts&&Array.isArray(o.helpContacts)&&mode==="replace"){CONTACTS=o.helpContacts;saveContacts()}
      if(o.userProfiles&&o.userProfiles[0]&&mode==="replace"){P=Object.assign({},DEF_PROFILE,o.userProfiles[0]);saveProfile()}
    }
    mergeBooks(books,mode); S.msg=t("imported"); render();
  }catch(e){S.msg=t("importErr"); render()}
}

  if(S.book==="__freq"){
    const arr=Object.entries(USAGE).sort((a,b)=>b[1].n-a[1].n).slice(0,12);
    body=arr.length?arr.map(([k,u])=>`<div class="item"><button class="tile" data-act="pickfreq" data-id="${esc(k)}">${P.icons?`<span class="ic">${esc(u.icon)}</span>`:""}<span class="tx">${disp(u)}</span><span class="lv">×${u.n}</span></button><div class="ctl"><button class="btn small" data-act="freqadd" data-id="${esc(k)}">＋</button></div></div>`).join(""):`<p>${t("noItems")}</p>`;
  }else{
    body=(b.items.length?b.items.map((it,i)=>bookItemHTML(it,i,b.items.length)).join(""):`<p>${t("noItems")}</p>`);
    body+=`<div class="row"><button class="btn" data-act="toggleedit" aria-pressed="${S.edit}">${S.edit?t("done"):t("edit")}</button><button class="btn" data-act="addform">＋ ${t("addPhrase")}</button><button class="btn" data-act="printbook">${t("print")}</button></div>`;
    if(S.edit) body+=`<div class="row"><button class="btn small" data-act="renbook">${t("rename")}</button><button class="btn small danger" data-act="delbook">${t("delBook")}</button></div>`;
    if(S.form) body+=`<div class="pane"><label class="f" for="f-text">${t("phText")}</label><input type="text" id="f-text"><label class="f" for="f-yomi">${t("phYomi")}</label><input type="text" id="f-yomi"><label class="f" for="f-en">${t("phEn")}</label><input type="text" id="f-en"><div class="row"><button class="btn pri" data-act="saveform">${t("save")}</button></div></div>`;
  }
  return `<div class="tabs">${tabs}</div>${body}`;
}
let lastKey=null;
function render(){
  const ae=document.activeElement; lastKey=ae&&ae.dataset&&ae.dataset.key||null;
  const typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="SELECT"||ae.tagName==="TEXTAREA");
  document.documentElement.dataset.theme=P.theme; document.documentElement.dataset.size=P.size;
  document.documentElement.lang=P.lang;
  document.documentElement.style.setProperty("--tile-min",tileMin()+"px");
  $a.innerHTML=headerHTML()+(INDEX?mainHTML():`<main class="p1"><div class="pane">${t("loading")}</div></main>`)+barHTML()+(INDEX?panelHTML():"");
  if(lastKey){const el=$a.querySelector(`[data-key="${lastKey}"]`); if(el&&!typing) el.focus({preventScroll:true})}
  const f=$a.querySelector('.overlay [data-key="p-close"], .full [data-key="p-close"]');
  if(f&&!lastKey) f.focus();
  const hs=$a.querySelectorAll("details[data-auto]"); hs.forEach(d=>{ if(!d.dataset.set){d.dataset.set=1} });
}

/* ---------- 操作 ---------- */
function pick(e){
  S.sel=Object.assign({},e);
  const heavy=isHeavy(e);
  if(layoutOf()==="p1"){
    if(P.confirm||heavy){S.panel="confirm"}else{speak(S.sel);return}
  }else if(!P.confirm&&!heavy){speak(S.sel);return}
  render();
}
async function setRole(id){
  P.role=id; saveProfile(); S.loading=true; S.panel=null; render();
  try{await loadRole(id)}catch(e){S.err=true}
  const sc=scenesOf(id); S.scene=sc[0]&&sc[0].id; S.intent="request"; S.level=0; S.page=0; S.step="scene"; S.loading=false; render();
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==="ovl"){ if(ev.target!==b) return; S.panel=null;S.msg="";render();return }
  switch(a){
  case "scene": S.scene=id;S.page=0; if(layoutOf()==="p1") S.step="intent"; render(); break;
  case "intent": S.intent=id;S.page=0; if(layoutOf()==="p1") S.step="expr"; render(); break;
  case "level": S.level=+id;S.page=0;render();break;
  case "prev": S.page=Math.max(0,S.page-1);render();break;
  case "next": S.page++;render();break;
  case "pick": pick(currentCandidates()[+b.dataset.i]); break;
  case "speak": speak(S.sel); if(S.panel==="confirm"){S.panel=null;render()} break;
  case "stop": stopSpeak(); break;
  case "showmode": S.panel="show";render();break;
  case "send": sendSel();break;
  case "addbook": if(S.sel){const ok=addToBook(S.sel);S.msg=ok?"★ "+curBook().name:"";render();setTimeout(()=>{S.msg="";render()},1800)}break;
  case "clearsel": S.sel=null;render();break;
  case "phback": S.step=S.step==="expr"?"intent":"scene";render();break;
  case "closep": S.panel=null;S.msg="";S.form=false;render();break;
  case "rolepick": S.panel="rolepick";render();break;
  case "role": setRole(id);break;
  case "attn": startAttn();break;
  case "stopattn": stopAttn();break;
  case "help": S.panel="help";render();break;
  case "settings": S.panel=S.panel==="settings"?null:"settings";render();break;
  case "fav": S.panel=S.panel==="fav"?null:"fav";S.edit=false;S.form=false;render();break;
  case "expjson": exportJson(document.getElementById("s-inc").checked);break;
  case "expcsv": exportCsv();break;
  case "booktab": S.book=id;S.edit=false;S.form=false;render();break;
  case "newbook":{const n=prompt(t("bookName"));if(n&&n.trim()){const nb={id:uid(),name:n.trim(),items:[]};BOOKS.push(nb);S.book=nb.id;saveBooks();render()}break}
  case "renbook":{const bk=curBook();const n=prompt(t("bookName"),bk.name);if(n&&n.trim()){bk.name=n.trim();saveBooks();render()}break}
  case "delbook":{if(confirm(t("confirmDel"))){BOOKS=BOOKS.filter(x=>x.id!==S.book);ensureBooks();saveBooks();S.edit=false;render()}break}
  case "toggleedit": S.edit=!S.edit;render();break;
  case "addform": S.form=!S.form;render();break;
  case "saveform":{
    const tx=document.getElementById("f-text").value.trim(); if(!tx) break;
    const yo=document.getElementById("f-yomi").value.trim(), en=document.getElementById("f-en").value.trim();
    const hira=yo||readingOf(tx);
    ensureBooks(); curBook().items.push({id:uid(),hira,ruby:tx,en,intent:"",scene:"",icon:"💬",count:0,created:today()});
    saveBooks();S.form=false;render();break}
  case "pickbook":{const it=curBook().items.find(i=>i.id===id); if(it){S.sel={id:"b-"+it.id,fromBook:it.id,hira:it.hira,ruby:it.ruby,en:it.en,icon:it.icon,intent:it.intent,scene:it.scene,role:null};S.panel=(P.confirm||isHeavy(S.sel))?(layoutOf()==="p1"?"confirm":null):null; if(!P.confirm&&!isHeavy(S.sel)){S.panel=null;speak(S.sel);return} render()} break}
  case "pickfreq":{const u=USAGE[id]; if(u){S.sel={id:u.role?id:id,hira:u.hira,ruby:u.ruby,en:u.en,icon:u.icon,intent:u.intent,scene:u.scene,role:u.role};S.panel=layoutOf()==="p1"?"confirm":null;render()} break}
  case "freqadd":{const u=USAGE[id]; if(u){S.book=BOOKS[0].id; addToBook({hira:u.hira,ruby:u.ruby,en:u.en,icon:u.icon,intent:u.intent,scene:u.scene}); S.book="__freq"; render()} break}
  case "bup":case "bdown":{const bk=curBook(),i=bk.items.findIndex(x=>x.id===id),j=a==="bup"?i-1:i+1; if(bk.items[j]){[bk.items[i],bk.items[j]]=[bk.items[j],bk.items[i]];saveBooks();render()}break}
  case "bdel":{const bk=curBook();bk.items=bk.items.filter(x=>x.id!==id);saveBooks();render();break}
  case "printbook": printBook();break;
  }
});
/* 長押し：マウス／タッチ／キーボード */
function holdAction(btn){
  if(btn.dataset.act==="speakHold"){ if(S.sel){speak(S.sel); if(S.panel==="confirm"){S.panel=null;render()}} }
  else if(btn.dataset.act==="callhold"){ location.href=btn.dataset.href }
}
document.addEventListener("pointerdown",ev=>{const b=ev.target.closest(".hold[data-act]"); if(b&&(b.dataset.act==="speakHold"||b.dataset.act==="callhold")){ev.preventDefault();holdStart(b,800,()=>holdAction(b))}});
["pointerup","pointercancel","pointerleave"].forEach(n=>document.addEventListener(n,ev=>{const b=ev.target.closest&&ev.target.closest(".hold"); if(b) holdCancel(b)},true));
document.addEventListener("keydown",ev=>{
  const b=ev.target.closest&&ev.target.closest(".hold[data-act]");
  if(b&&(ev.key===" "||ev.key==="Enter")){ev.preventDefault(); if(!ev.repeat) holdStart(b,800,()=>holdAction(b)); return}
  if(ev.target.matches&&ev.target.matches("input,select,textarea")) return;
  if(ev.key==="Escape"){ if(S.panel==="attn")stopAttn(); else if(S.panel){S.panel=null;S.msg="";render()} else if(layoutOf()==="p1"&&S.step!=="scene"){S.step=S.step==="expr"?"intent":"scene";render()} return }
  if(S.panel) return;
  if(ev.key===" "&&S.sel&&!isHeavy(S.sel)){ev.preventDefault();speak(S.sel);return}
  if(/^[1-9]$/.test(ev.key)&&(devType()==="desktop"||devType()==="laptop")){
    const list=currentCandidates(),i=S.page*perPage()+(+ev.key-1); if(list[i]) pick(list[i]);
  }
});
document.addEventListener("keyup",ev=>{const b=ev.target.closest&&ev.target.closest(".hold"); if(b&&(ev.key===" "||ev.key==="Enter")) holdCancel(b)});
document.addEventListener("toggle",ev=>{const d=ev.target; if(d&&d.dataset&&d.dataset.d) S.open[d.dataset.d]=d.open},true);
/* 設定フォーム */
document.addEventListener("change",ev=>{
  const el=ev.target, id=el.id||"";
  if(id==="s-file"&&el.files[0]){importFile(el.files[0],(document.querySelector('input[name="s-mode"]:checked')||{}).value||"append");return}
  if(el.dataset&&el.dataset.c!==undefined){const i=+el.dataset.c; CONTACTS[i]=CONTACTS[i]||{}; CONTACTS[i][el.dataset.f]=el.value.trim(); saveContacts(); return}
  if(!id.startsWith("s-")) return;
  if(id==="s-lang")P.lang=el.value;
  else if(id==="s-script")P.script=el.value;
  else if(id==="s-dev"){ if(el.value==="auto"){DEV={type:null,auto:true}}else{DEV={type:el.value,auto:false}} saveDev(); S.step="scene" }
  else if(id==="s-size")P.size=el.value;
  else if(id==="s-theme")P.theme=el.value;
  else if(id==="s-per")P.perPage=el.value;
  else if(id==="s-rate")P.rate=+el.value;
  else if(id==="s-vol")P.volume=+el.value;
  else if(id==="s-icons")P.icons=el.checked;
  else if(id==="s-confirm")P.confirm=el.checked;
  else return;
  saveProfile(); if(id==="s-per")S.page=0; render();
  const nx=document.getElementById(id); nx&&nx.focus();
});
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(INDEX&&!S.loading){ if(devType()==="phone"&&innerWidth>innerHeight&&S.sel&&!S.panel){S.panel="show"} render()}},150)});

/* ---------- 起動 ---------- */
(async function init(){
  ensureBooks(); render();
  try{
    INDEX=await loadIndex();
    if(!INDEX.roles.find(r=>r.id===P.role)) P.role=INDEX.roles[0].id;
    await loadRole(P.role);
    const sc=scenesOf(P.role); S.scene=sc[0]&&sc[0].id; S.loading=false; render();
  }catch(e){S.loading=false;S.err=true;INDEX=INDEX||{roles:[],scenes:[],intents:[]};render()}
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)&&VARIANT==="public"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
</body>
