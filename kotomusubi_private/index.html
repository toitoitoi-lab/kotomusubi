function detectDevice(){
  const coarse=matchMedia("(pointer:coarse)").matches;
  const w=innerWidth,h=innerHeight,m=Math.min(w,h);
  if(coarse) return m<600?"phone":"tablet";
  return w>=1700?"desktop":"laptop";
}
function devType(){return DEV.auto||!DEV.type?detectDevice():DEV.type}
function layoutOf(){
  const d=devType();
  if(d==="phone") return "p1";
  if(d==="tablet") return innerWidth>=innerHeight?"t2l":"t2p";
  return "d3";
}
function perPage(){
  if(P.perPage!=="auto") return +P.perPage;
  const d=devType(); return d==="phone"?4:d==="tablet"?8:12;
}
function tileMin(){const d=devType();return d==="phone"?72:d==="tablet"?96:64}

const RAW={}; let DIALIDX=null; const DIAL={id:"std",map:null,rules:null};
const REQUEST_URL="https://github.com/toitoitoi-lab/kotomusubi/issues/new";
const normStd=h=>h.replace(/[\s、。，．！？!?]/g,"");
function hydrate(id){
  return RAW[id].map(r=>{
    const o={id:r[0],scene:r[1],intent:r[2],level:r[3],hira:r[4],ruby:r[5],en:r[6],icon:r[7],role:id};
    if((DIAL.map||DIAL.rules)&&!isHeavy(o)){
      let d=DIAL.map&&DIAL.map.get(normStd(r[4]));
      if(!d&&DIAL.rules){let t=r[4]; for(const [re,rp] of DIAL.rules) t=t.replace(re,rp); if(t!==r[4]) d=t}
      if(d){o.std=o.hira;o.hira=d;o.ruby=d;o.dial=true}
    }
    return o;
  });
}

let voices=[];
function refreshVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]} if(typeof S!=="undefined"&&S.panel==="settings"&&typeof render==="function"&&!document.activeElement.matches("select,input")) render()}
if("speechSynthesis" in window){refreshVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",refreshVoices)}
const ttsOK=()=>"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
function voiceScore(v){
  const n=(v.name||"").toLowerCase(); let sc=0;
  if(/natural|neural|online|multilingual/.test(n)) sc+=8;
  if(/enhanced|premium|siri|\(premium\)|\(enhanced\)/.test(n)) sc+=7;
  if(/^google/.test(n)) sc+=5;
  if(/^(samantha|alex|daniel|karen|moira|tessa|serena|ava|allison|susan|zira|aria|jenny|guy|kyoko|otoya|nanami|keita|haruka)\b/.test(n)) sc+=5;
  /* ロボット声・かすれ声・効果音声は避ける */
  if(/whisper|fred|ralph|kathy|junior|albert|bruce|vicki|victoria|princess|agnes|eddy|flo\b|grandma|grandpa|rocko|sandy|shelley|reed|bad news|good news|bahh|bells|boing|bubbles|cellos|wobble|jester|organ|superstar|trinoids|zarvox|hysterical|deranged|compact|espeak|novelty/.test(n)) sc-=12;
  if(v.localService===false) sc+=1;
  return sc;
}
function voicesFor(lang){
  const pre=lang.slice(0,2).toLowerCase();
  return voices.filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(pre)).sort((a,b)=>voiceScore(b)-voiceScore(a));
}
function pickVoice(lang){
  const list=voicesFor(lang); const saved=lang.startsWith("en")?P.voiceEn:P.voiceJa;
  if(saved){const v=list.find(v=>v.voiceURI===saved||v.name===saved); if(v) return v}
  const exact=list.filter(v=>v.lang.toLowerCase().replace("_","-")===lang.toLowerCase());
  return (exact[0]&&voiceScore(exact[0])>=voiceScore(list[0])-1?exact[0]:list[0])||null;
}
function speak(e){
  if(!e) return;
  recordUse(e);
  if(!ttsOK()){S.panel="show";S.msg=t("noTTS");render();return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speakText(e));
    const isE=P.lang==="en"||e.ascii; const lang=isE?"en-US":"ja-JP"; u.lang=lang; u.rate=isE?Math.max(+P.rate,0.95):+P.rate;
    const v=pickVoice(lang); if(v){u.voice=v; u.lang=v.lang}
    u.onstart=()=>{S.speaking=true;render()};
    u.onend=u.onerror=()=>{S.speaking=false;render()};
    S.speaking=true; speechSynthesis.speak(u);
  }catch(err){S.panel="show";S.msg=t("noTTS")}
  render();
}
function testVoice(lang){
  if(!ttsOK()) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(lang==="en"?"Hello. Nice to meet you.":"こんにちは。よろしく おねがいします。");
    const L=lang==="en"?"en-US":"ja-JP"; u.lang=L; u.rate=lang==="en"?Math.max(+P.rate,0.95):+P.rate; const v=pickVoice(L); if(v){u.voice=v;u.lang=v.lang} speechSynthesis.speak(u)}catch(e){}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){} S.speaking=false;render()}
function recordUse(e){
  const key=e.role&&e.id&&!e.fromBook?e.id:(e.fromBook||null);
  if(e.fromBook){const b=BOOKS.find(b=>b.items.some(i=>i.id===e.fromBook));const it=b&&b.items.find(i=>i.id===e.fromBook);if(it){it.count=(it.count||0)+1;saveBooks()}}

/* ---------- よびかけの音 ---------- */
function startAttn(){
  S.panel="attn"; render();
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume&&audioCtx.resume();
    const g=audioCtx.createGain(); g.gain.value=[0.25,0.5,0.9][P.volume]||0.5; g.connect(audioCtx.destination);
    let n=0;
    const beep=()=>{
      const o=audioCtx.createOscillator(); o.type="square"; o.frequency.value=n++%2?660:880;
      o.connect(g); o.start(); o.stop(audioCtx.currentTime+0.28);
    };
    beep(); clearInterval(attnTimer); const started=Date.now();
    attnTimer=setInterval(()=>{beep(); if(Date.now()-started>60000) stopAttn()},600);
    window._attnGain=g;
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([300,200,300,200,300]);
}
function stopAttn(){clearInterval(attnTimer);attnTimer=null;try{window._attnGain&&window._attnGain.disconnect()}catch(e){} if(navigator.vibrate)navigator.vibrate(0); if(S.panel==="attn"){S.panel=null;render()}}

function csvCell(s){s=String(s??"");return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){
  const rows=[["帖","表示する文","よみ","English","意図","場面"]];
  BOOKS.forEach(b=>b.items.forEach(i=>rows.push([b.name,i.ruby,i.hira,i.en,i.intent,i.scene])));
  download(`kotomusubi_kotobacho_${stamp()}.csv`,"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv");
}
function parseCsv(s){
  s=s.replace(/^﻿/,""); const out=[]; let row=[],cell="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"') q=true;
    else if(c===",") {row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&s[i+1]==="\n") i++; row.push(cell);cell="";out.push(row);row=[] }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);out.push(row)}
  return out.filter(r=>r.some(x=>x!==""));
}
function mergeBooks(incoming,mode){
  if(mode==="replace") BOOKS=[];
  incoming.forEach(nb=>{
    let b=BOOKS.find(x=>x.name===nb.name);
    if(!b){b={id:uid(),name:nb.name,items:[]};BOOKS.push(b)}
    (nb.items||[]).forEach(it=>{
      if(!it.ruby&&!it.hira) return;
      const hira=it.hira||readingOf(it.ruby), ruby=it.ruby||it.hira;
      if(b.items.some(x=>x.hira===hira&&x.ruby===ruby)) return;
      b.items.push({id:uid(),hira,ruby,en:it.en||"",intent:it.intent||"",scene:it.scene||"",icon:it.icon||"💬",count:it.count||0,created:it.created||today()});
    });
  });
  ensureBooks(); saveBooks();
}
async function importFile(file,mode){
  try{
    const txt=await file.text(); let books;
    if(/\.csv$/i.test(file.name)){
      const rows=parseCsv(txt).slice(1); const m={};
      rows.forEach(r=>{const [bn,ruby,hira,en,intent,scene]=r; if(!bn||!ruby) return; (m[bn]=m[bn]||{name:bn,items:[]}).items.push({ruby,hira:hira||readingOf(ruby),en,intent,scene})});
      books=Object.values(m);
    }else{
      const o=JSON.parse(txt); if(o.app!=="kotomusubi") throw new Error("app");
      books=o.kotobacho||[];
      if(o.helpContacts&&Array.isArray(o.helpContacts)&&mode==="replace"){CONTACTS=o.helpContacts;saveContacts()}
      if(o.userProfiles&&o.userProfiles[0]&&mode==="replace"){P=Object.assign({},DEF_PROFILE,o.userProfiles[0]);saveProfile()}
    }
    mergeBooks(books,mode); S.msg=t("imported"); render();
  }catch(e){S.msg=t("importErr"); render()}
}

const ROWS=[["あ","い","う","え","お"],["か","き","く","け","こ"],["さ","し","す","せ","そ"],["た","ち","つ","て","と"],["な","に","ぬ","ね","の"],["は","ひ","ふ","へ","ほ"],["ま","み","む","め","も"],["や","","ゆ","","よ"],["ら","り","る","れ","ろ"],["わ","","を","","ん"]];
const DAKU=["かがか","きぎき","くぐく","けげけ","こごこ","さざさ","しじし","すずす","せぜせ","そぞそ","ただた","ちぢち","つづつ","てでて","とどと","はばぱは","ひびぴひ","ふぶぷふ","へべぺへ","ほぼぽほ","うゔう"].map(x=>[...x]);
const SMALL=[["あ","ぁ"],["い","ぃ"],["う","ぅ"],["え","ぇ"],["お","ぉ"],["つ","っ"],["や","ゃ"],["ゆ","ゅ"],["よ","ょ"],["わ","ゎ"]];
const toHira=x=>String(x).replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const toKata=x=>String(x).replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const ROWS_KATA=ROWS.map(r=>r.map(toKata));
const isAbc=()=>P.lang==="en"||P.inputKind==="abc";
const rowsNow=()=>P.inputKind==="kata"?ROWS_KATA:ROWS;
const isAsciiText=x=>/^[\x20-\x7e]+$/.test(x)&&/[a-z]/i.test(x);
function cycleChar(c0){
  const c=toHira(c0), kata=c!==c0;
  const r=cycleChar0(c); return r&&kata?toKata(r):r;
}
function cycleChar0(c){
  for(const g of DAKU){const i=g.indexOf(c); if(i>=0&&i<g.length-1) return g[i+1]; if(i===g.length-1) return g[0]}
  return null;
}
const useBoard=()=>true; const isEn=()=>P.lang==="en";
const LETTERS="abcdefghijklmnopqrstuvwxyz".split("");
function kanaMode(){ if(P.kana==="full") return "full"; if(P.kana==="step2") return "step2"; return devType()==="phone"?"step2":"full"; }
function syncFree(){

  const asc=isAsciiText(tx);
  S.sel=tx?{id:"free",free:true,ascii:asc,hira:P.lang==="en"?tx:readingOf(tx),ruby:tx,en:(P.lang==="en"||asc)?tx:"",icon:"✏️",intent:"",scene:"",role:null}:null;
}
function insertText(x){
  const c=Math.min(S.caret,S.buf.length);
  S.buf=S.buf.slice(0,c)+x+S.buf.slice(c); S.caret=c+x.length; syncFree();
}
function deleteBack(){
  const c=Math.min(S.caret,S.buf.length); if(c<=0) return;
  const a=[...S.buf.slice(0,c)]; a.pop(); const head=a.join("");
  S.buf=head+S.buf.slice(c); S.caret=head.length; syncFree();
}
function cycleLast(kind){
  const c=Math.min(S.caret,S.buf.length); if(c<=0) return;
  const ch=S.buf[c-1], n=kind==="small"?smallChar(ch):cycleChar(ch); if(!n) return;
  S.buf=S.buf.slice(0,c-1)+n+S.buf.slice(c); syncFree();
}
function smallChar(c0){
  const c=toHira(c0), kata=c!==c0;
  for(const [a,b] of SMALL){ const r=c===a?b:(c===b?a:null); if(r) return kata?toKata(r):r }
  return null;
}
function sceneExprs(){return (CACHE[P.role]||[]).filter(e=>e.scene===S.scene)}
function predictions(){
  const n=+P.predict; if(!n||!S.buf.trim()) return [];
  const en=isEn()||isAsciiText(S.buf.trim());
  const key=en?S.buf.trim().toLowerCase().replace(/\s+/g," "):toHira(S.buf.replace(/\s/g,"")); if(!key) return [];
  const seen=new Set(), out=[];
  const pool=[];
  BOOKS.forEach(b=>b.items.forEach(i=>pool.push(i)));
  Object.values(USAGE).forEach(u=>pool.push(u));
  sceneExprs().forEach(e=>pool.push(e));
  for(const e of pool){
    if(en){
      const x=(e.en||"").toLowerCase(); if(!x||x===key||!x.startsWith(key)) continue;
      if(seen.has(x)) continue; seen.add(x); out.push(e); if(out.length>=n) break; continue;
    }
    const h=e.hira.replace(/\s/g,""), k=toHira(stripRuby(e.ruby).replace(/\s/g,""));
    if(h===key||k===key) continue;
    if(!(h.startsWith(key)||k.startsWith(key))) continue;
    if(seen.has(e.hira)) continue; seen.add(e.hira); out.push(e);
    if(out.length>=n) break;
  }
  return out;
}
function tiles(){
  const cnt=new Map();
  if(isAbc()){
    sceneExprs().forEach(e=>{ (e.en||"").replace(/[.,?!]/g,"").split(/\s+/).forEach(w=>{ if(w.length<3) return; const k=w.toLowerCase(); const o=cnt.get(k)||{hira:k,ruby:k,en:k,n:0}; o.n++; cnt.set(k,o)}) });
    return [...cnt.values()].sort((a,b)=>b.n-a.n||a.hira.length-b.hira.length).slice(0,14);
  }
  sceneExprs().forEach(e=>{
    const h=e.hira.split(" "), r=e.ruby.split(" ");
    h.forEach((w,i)=>{ if(w.length<2) return; const o=cnt.get(w)||{hira:w,ruby:r[i]||w,n:0}; o.n++; cnt.set(w,o)});
  });
  return [...cnt.values()].sort((a,b)=>b.n-a.n||a.hira.length-b.hira.length).slice(0,14);
}

function boardHTMLabc(){

   <div><label class="f" for="s-script">${t("script")}</label><select id="s-script">${["hira","kanji","ruby"].map(k=>opt(k,P.script,t("scripts")[k])).join("")}</select></div>
   <div><label class="f" for="s-dial">${t("dialLabel")}</label><select id="s-dial">${opt("std",P.dialect,t("dialStd"))}${((DIALIDX&&DIALIDX.regions)||[]).map(r=>opt(r.id,P.dialect,(P.lang==="en"?r.en:r.ja)+"（"+t(r.status==="draft"?"dialDraft":"dialWanted")+"）")).join("")}</select>${dialNote()}<a class="lnk" href="${REQUEST_URL}" target="_blank" rel="noopener noreferrer">${t("dialReq")}</a></div>
   <div><label class="f" for="s-dev">${t("device")}</label><select id="s-dev">${opt("auto",DEV.auto?"auto":DEV.type,t("devAuto")+"（"+t("devs")[detectDevice()]+"）")}${["desktop","laptop","tablet","phone"].map(k=>opt(k,DEV.auto?"auto":DEV.type,t("devs")[k])).join("")}</select></div>
   <div><label class="f" for="s-size">${t("size")}</label><select id="s-size">${["M","L","XL"].map(k=>opt(k,P.size,k)).join("")}</select></div>
   <div><label class="f" for="s-theme">${t("theme")}</label><select id="s-theme">${["normal","high","cyan"].map(k=>opt(k,P.theme,t("themes")[k])).join("")}</select></div>
   <div><label class="f" for="s-per">${t("perPage")}</label><select id="s-per">${opt("auto",P.perPage,t("auto"))}${[4,6,8,12].map(k=>opt(k,P.perPage,k)).join("")}</select></div>
   <div><label class="f" for="s-rate">${t("rate")}（${P.rate}）</label><input type="range" id="s-rate" min="0.5" max="1.3" step="0.1" value="${P.rate}" style="width:100%"></div>
   <div><label class="f" for="s-compose">${t("compose")}</label><select id="s-compose">${["pick","both"].map(k=>opt(k,P.compose,t("composeOpts")[k])).join("")}</select></div>
   <div><label class="f" for="s-kind">${t("kindLabel")}</label><select id="s-kind">${[["hira","kindHira"],["kata","kindKata"],["abc","kindAbc"]].map(([k,l])=>opt(k,P.inputKind,t(l))).join("")}</select></div>
   <div><label class="f" for="s-abcl">${t("layoutLabel")}</label><select id="s-abcl">${[["abc","layoutAbc"],["qwerty","layoutQw"]].map(([k,l])=>opt(k,P.abcLayout,t(l))).join("")}</select></div>
   <div><label class="f" for="s-predict">${t("predict")}</label><select id="s-predict">${[0,3,5,8].map(k=>opt(k,P.predict,k)).join("")}</select></div>
   <div><label class="f" for="s-kana">${t("kana")}</label><select id="s-kana">${["auto","full","step2"].map(k=>opt(k,P.kana,t("kanaOpts")[k])).join("")}</select></div>
   <div><label class="f" for="s-vja">${t("voiceJa")}</label>${voiceNote("ja-JP")}<select id="s-vja">${voiceOpts("ja-JP",P.voiceJa)}</select><button class="btn small" data-act="vtest" data-id="ja" style="margin-top:.3rem">🔊 ${t("voiceTest")}</button></div>
   <div><label class="f" for="s-ven">${t("voiceEn")}</label>${voiceNote("en-US")}<select id="s-ven">${voiceOpts("en-US",P.voiceEn)}</select><button class="btn small" data-act="vtest" data-id="en" style="margin-top:.3rem">🔊 ${t("voiceTest")}</button></div>
   <div><label class="f" for="s-vol">${t("volume")}</label><select id="s-vol">${t("vols").map((v,i)=>opt(i,P.volume,v)).join("")}</select></div>
  </div>
  ${chk("s-icons",P.icons,t("icons"))}${chk("s-confirm",P.confirm,t("confirm"))}
  <details data-auto data-d="contacts" ${S.open.contacts?"open":""}><summary>${t("contacts")}</summary>${cs}</details>
  <details data-auto data-d="data" ${S.open.data?"open":""}><summary>${t("data")}</summary>
   <div class="row"><button class="btn" data-act="expjson">${t("exportJson")}</button><button class="btn" data-act="expcsv">${t("exportCsv")}</button></div>
   ${chk("s-inc",false,t("inclContacts"))}
   <label class="f">${t("importF")}（.json / .csv）</label><input type="file" id="s-file" accept=".json,.csv,application/json,text/csv">
   <div class="row"><label><input type="radio" name="s-mode" value="append" checked> ${t("append")}</label><label><input type="radio" name="s-mode" value="replace"> ${t("replace")}</label></div>
   ${S.msg?`<p class="note" role="status">${esc(S.msg)}</p>`:""}</details>
  <details data-auto data-d="about" ${S.open.about?"open":""}><summary>${t("about")}</summary><p class="note">${t("privacy")}</p><p class="note">${t("emergency")}</p><p class="note">KOTOMUSUBI ${VERSION} (${VARIANT}) — toi toi toi</p></details>`;
}
function bookItemHTML(it,idx,n){
  const t0=`<button class="tile" data-act="pickbook" data-id="${it.id}">${P.icons?`<span class="ic">${esc(it.icon)}</span>`:""}<span class="tx">${disp(it)}</span></button>`;
  if(!S.edit) return `<div class="item">${t0}</div>`;
  return `<div class="item">${t0}<div class="ctl"><button class="btn small" data-act="bup" data-id="${it.id}" ${idx===0?"disabled":""} aria-label="${t("up")}">▲</button><button class="btn small" data-act="bdown" data-id="${it.id}" ${idx===n-1?"disabled":""} aria-label="${t("down")}">▼</button><button class="btn small danger" data-act="bdel" data-id="${it.id}">${t("del")}</button></div></div>`;
}
function favHTML(){
  ensureBooks(); const b=S.book==="__freq"?null:curBook();
  const tabs=BOOKS.map(x=>`<button class="chip" data-act="booktab" data-id="${x.id}" aria-pressed="${S.book===x.id}">${esc(x.name)}</button>`).join("")+
    `<button class="chip" data-act="booktab" data-id="__freq" aria-pressed="${S.book==="__freq"}">${t("freq")}</button><button class="chip" data-act="newbook">＋ ${t("newBook")}</button>`;
  let body="";
  if(S.book==="__freq"){
    const arr=Object.entries(USAGE).sort((a,b)=>b[1].n-a[1].n).slice(0,12);
    body=arr.length?arr.map(([k,u])=>`<div class="item"><button class="tile" data-act="pickfreq" data-id="${esc(k)}">${P.icons?`<span class="ic">${esc(u.icon)}</span>`:""}<span class="tx">${disp(u)}</span><span class="lv">×${u.n}</span></button><div class="ctl"><button class="btn small" data-act="freqadd" data-id="${esc(k)}">＋</button></div></div>`).join(""):`<p>${t("noItems")}</p>`;
  }else{
    body=(b.items.length?b.items.map((it,i)=>bookItemHTML(it,i,b.items.length)).join(""):`<p>${t("noItems")}</p>`);
    body+=`<div class="row"><button class="btn" data-act="toggleedit" aria-pressed="${S.edit}">${S.edit?t("done"):t("edit")}</button><button class="btn" data-act="addform">＋ ${t("addPhrase")}</button><button class="btn" data-act="printbook">${t("print")}</button></div>`;
    if(S.edit) body+=`<div class="row"><button class="btn small" data-act="renbook">${t("rename")}</button><button class="btn small danger" data-act="delbook">${t("delBook")}</button></div>`;
    if(S.form) body+=`<div class="pane"><label class="f" for="f-text">${t("phText")}</label><input type="text" id="f-text"><label class="f" for="f-yomi">${t("phYomi")}</label><input type="text" id="f-yomi"><label class="f" for="f-en">${t("phEn")}</label><input type="text" id="f-en"><div class="row"><button class="btn pri" data-act="saveform">${t("save")}</button></div></div>`;
  }
  return `<div class="tabs">${tabs}</div>${body}`;
}
let lastKey=null;
function render(){
  const ae=document.activeElement; lastKey=ae&&ae.dataset&&ae.dataset.key||null;
  const typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="SELECT"||ae.tagName==="TEXTAREA");
  document.documentElement.dataset.theme=P.theme; document.documentElement.dataset.size=P.size;
  document.documentElement.lang=P.lang;
  document.documentElement.style.setProperty("--tile-min",tileMin()+"px");
  $a.innerHTML=headerHTML()+modesHTML()+(INDEX?mainHTML():`<main class="p1"><div class="pane">${t("loading")}</div></main>`)+barHTML()+(INDEX?panelHTML():"");
  if(lastKey){const el=$a.querySelector(`[data-key="${lastKey}"]`); if(el&&!typing) el.focus({preventScroll:true})}
  const f=$a.querySelector('.overlay [data-key="p-close"], .full [data-key="p-close"]');
  if(f&&!lastKey) f.focus();
  const ta=document.getElementById("buf"); if(ta){ try{ta.setSelectionRange(S.caret,S.caret)}catch(e){} }
  const hs=$a.querySelectorAll("details[data-auto]"); hs.forEach(d=>{ if(!d.dataset.set){d.dataset.set=1} });
}

/* ---------- 操作 ---------- */
function pick(e){
  S.sel=Object.assign({},e);
  const heavy=isHeavy(e);
  if(layoutOf()==="p1"){
    if(P.confirm||heavy){S.panel="confirm"}else{speak(S.sel);return}
  }else if(!P.confirm&&!heavy){speak(S.sel);return}
  render();
}
async function setRole(id){
  P.role=id; saveProfile(); S.loading=true; S.panel=null; render();
  try{await loadRole(id)}catch(e){S.err=true}
  const sc=scenesOf(id); S.scene=sc[0]&&sc[0].id; S.intent="request"; S.level=0; S.page=0; S.step="scene"; S.loading=false; render();
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==="ovl"){ if(ev.target!==b) return; S.panel=null;S.msg="";render();return }
  switch(a){
  case "scene": S.scene=id;S.page=0; if(layoutOf()==="p1") S.step="intent"; render(); break;
  case "intent": S.intent=id;S.page=0; if(layoutOf()==="p1") S.step="expr"; render(); break;
  case "level": S.level=+id;S.page=0;render();break;
  case "prev": S.page=Math.max(0,S.page-1);render();break;
  case "next": S.page++;render();break;
  case "pick": pick(currentCandidates()[+b.dataset.i]); break;
  case "speak": speak(S.sel); if(S.panel==="confirm"){S.panel=null;render()} break;
  case "stop": stopSpeak(); break;
  case "showmode": S.panel="show";render();break;
  case "send": sendSel();break;
  case "addbook": if(S.sel){const ok=addToBook(S.sel);S.msg=ok?"★ "+curBook().name:"";render();setTimeout(()=>{S.msg="";render()},1800)}break;
  case "clearsel": S.sel=null; if(S.mode==="make"){S.buf="";S.caret=0} render(); break;
  case "mode":
    if(id==="pick"){S.mode="pick"; if(S.sel&&S.sel.free)S.sel=null}
    else{
      S.mode="make";
      if(id==="goj"){ if(P.inputKind==="abc")P.inputKind="hira" }
      else { if(P.lang==="ja")P.inputKind="abc"; P.abcLayout=id==="qwerty"?"qwerty":"abc" }
      saveProfile();
      syncFree();
    }
    render(); break;
  case "vtest": testVoice(id==="en"?"en":"ja"); break;
  case "kana": insertText(b.dataset.c); S.row=null; render(); break;
  case "krow": S.row=+b.dataset.i; render(); break;
  case "kback": S.row=null; render(); break;
  case "kdel": deleteBack(); render(); break;
  case "kclr": S.buf="";S.caret=0;S.row=null;syncFree();render();break;
  case "kdaku": cycleLast("daku"); render(); break;
  case "ksmall": cycleLast("small"); render(); break;
  case "kword": insertText(b.dataset.w); render(); break;
  case "ktile": {const o=tiles()[+b.dataset.i]; if(o){ if(isAbc()){const up=atStart(); insertText((up?o.hira[0].toUpperCase()+o.hira.slice(1):o.hira)+" ")} else insertText(P.inputKind==="kata"?toKata(o.hira):o.hira); render()} break}
  case "kind": P.inputKind=id; saveProfile(); S.row=null; render(); break;
  case "abcl": P.abcLayout=id; saveProfile(); render(); break;
  case "klet": {const c=b.dataset.c; insertText(atStart()||S.shift?c.toUpperCase():c); S.shift=false; render(); break}
  case "kshift": S.shift=!S.shift; render(); break;
  case "kpred": {const e=predictions()[+b.dataset.i]; if(e){S.buf=(isEn()||isAsciiText(S.buf.trim()))?e.en:(P.inputKind==="kata"?toKata(e.hira):e.hira); S.caret=S.buf.length; syncFree(); render()} break}
  case "phback": S.step=S.step==="expr"?"intent":"scene";render();break;
  case "closep": S.panel=null;S.msg="";S.form=false;render();break;
  case "rolepick": S.panel="rolepick";render();break;
  case "dialpick": S.panel="dialpick";render();break;
  case "scriptcycle": {const o=["ruby","hira","kanji"]; P.script=o[(o.indexOf(P.script)+1)%3]; P.scriptUser=true; saveProfile(); render(); break}
  case "dial": P.dialect=id; saveProfile(); setDialect(id).then(()=>{S.panel=null;render()}); break;
  case "role": setRole(id);break;
  case "attn": startAttn();break;
  case "stopattn": stopAttn();break;
  case "help": S.panel="help";render();break;
  case "settings": S.panel=S.panel==="settings"?null:"settings";render();break;
  case "fav": S.panel=S.panel==="fav"?null:"fav";S.edit=false;S.form=false;render();break;
  case "expjson": exportJson(document.getElementById("s-inc").checked);break;
  case "expcsv": exportCsv();break;
  case "booktab": S.book=id;S.edit=false;S.form=false;render();break;
  case "newbook":{const n=prompt(t("bookName"));if(n&&n.trim()){const nb={id:uid(),name:n.trim(),items:[]};BOOKS.push(nb);S.book=nb.id;saveBooks();render()}break}
  case "renbook":{const bk=curBook();const n=prompt(t("bookName"),bk.name);if(n&&n.trim()){bk.name=n.trim();saveBooks();render()}break}
  case "delbook":{if(confirm(t("confirmDel"))){BOOKS=BOOKS.filter(x=>x.id!==S.book);ensureBooks();saveBooks();S.edit=false;render()}break}
  case "toggleedit": S.edit=!S.edit;render();break;
  case "addform": S.form=!S.form;render();break;
  case "saveform":{
    const tx=document.getElementById("f-text").value.trim(); if(!tx) break;
    const yo=document.getElementById("f-yomi").value.trim(), en=document.getElementById("f-en").value.trim();
    const hira=yo||readingOf(tx);
    ensureBooks(); curBook().items.push({id:uid(),hira,ruby:tx,en,intent:"",scene:"",icon:"💬",count:0,created:today()});
    saveBooks();S.form=false;render();break}
  case "pickbook":{const it=curBook().items.find(i=>i.id===id); if(it){S.sel={id:"b-"+it.id,fromBook:it.id,hira:it.hira,ruby:it.ruby,en:it.en,icon:it.icon,intent:it.intent,scene:it.scene,role:null};S.panel=(P.confirm||isHeavy(S.sel))?(layoutOf()==="p1"?"confirm":null):null; if(!P.confirm&&!isHeavy(S.sel)){S.panel=null;speak(S.sel);return} render()} break}
  case "pickfreq":{const u=USAGE[id]; if(u){S.sel={id:u.role?id:id,hira:u.hira,ruby:u.ruby,en:u.en,icon:u.icon,intent:u.intent,scene:u.scene,role:u.role};S.panel=layoutOf()==="p1"?"confirm":null;render()} break}
  case "freqadd":{const u=USAGE[id]; if(u){S.book=BOOKS[0].id; addToBook({hira:u.hira,ruby:u.ruby,en:u.en,icon:u.icon,intent:u.intent,scene:u.scene}); S.book="__freq"; render()} break}
  case "bup":case "bdown":{const bk=curBook(),i=bk.items.findIndex(x=>x.id===id),j=a==="bup"?i-1:i+1; if(bk.items[j]){[bk.items[i],bk.items[j]]=[bk.items[j],bk.items[i]];saveBooks();render()}break}
  case "bdel":{const bk=curBook();bk.items=bk.items.filter(x=>x.id!==id);saveBooks();render();break}
  case "printbook": printBook();break;
  }
});
/* 長押し：マウス／タッチ／キーボード */
function holdAction(btn){
  if(btn.dataset.act==="speakHold"){ if(S.sel){speak(S.sel); if(S.panel==="confirm"){S.panel=null;render()}} }
  else if(btn.dataset.act==="callhold"){ location.href=btn.dataset.href }
}
document.addEventListener("pointerdown",ev=>{const b=ev.target.closest(".hold[data-act]"); if(b&&(b.dataset.act==="speakHold"||b.dataset.act==="callhold")){ev.preventDefault();holdStart(b,800,()=>holdAction(b))}});
["pointerup","pointercancel","pointerleave"].forEach(n=>document.addEventListener(n,ev=>{const b=ev.target.closest&&ev.target.closest(".hold"); if(b) holdCancel(b)},true));
document.addEventListener("keydown",ev=>{
  const b=ev.target.closest&&ev.target.closest(".hold[data-act]");
  if(b&&(ev.key===" "||ev.key==="Enter")){ev.preventDefault(); if(!ev.repeat) holdStart(b,800,()=>holdAction(b)); return}
  if(ev.target.matches&&ev.target.matches("input,select,textarea")) return;
  if(ev.key==="Escape"){ if(S.panel==="attn")stopAttn(); else if(S.panel){S.panel=null;S.msg="";render()} else if(layoutOf()==="p1"&&S.step!=="scene"){S.step=S.step==="expr"?"intent":"scene";render()} return }
  if(S.panel) return;
  if(S.mode==="make") return;
  if(ev.key===" "&&S.sel&&!isHeavy(S.sel)&&!(ev.target.matches&&ev.target.matches("button,a,summary"))){ev.preventDefault();speak(S.sel);return}
  if(/^[1-9]$/.test(ev.key)&&(devType()==="desktop"||devType()==="laptop")){
    const list=currentCandidates(),i=S.page*perPage()+(+ev.key-1); if(list[i]) pick(list[i]);
  }
});
document.addEventListener("keyup",ev=>{const b=ev.target.closest&&ev.target.closest(".hold"); if(b&&(ev.key===" "||ev.key==="Enter")) holdCancel(b)});
document.addEventListener("toggle",ev=>{const d=ev.target; if(d&&d.dataset&&d.dataset.d) S.open[d.dataset.d]=d.open},true);
document.addEventListener("input",ev=>{
  if(ev.target.id==="buf"){ S.buf=ev.target.value; S.caret=ev.target.selectionStart; updateLive() }
});
["keyup","click","select"].forEach(n=>document.addEventListener(n,ev=>{ if(ev.target.id==="buf") S.caret=ev.target.selectionStart }));
document.addEventListener("change",ev=>{ if(ev.target.id==="c-scene"){ S.scene=ev.target.value; render() } });
/* 設定フォーム */
document.addEventListener("change",ev=>{
  const el=ev.target, id=el.id||"";
  if(id==="s-file"&&el.files[0]){importFile(el.files[0],(document.querySelector('input[name="s-mode"]:checked')||{}).value||"append");return}
  if(el.dataset&&el.dataset.c!==undefined){const i=+el.dataset.c; CONTACTS[i]=CONTACTS[i]||{}; CONTACTS[i][el.dataset.f]=el.value.trim(); saveContacts(); return}
  if(!id.startsWith("s-")) return;
  if(id==="s-lang")P.lang=el.value;
  else if(id==="s-script"){P.script=el.value;P.scriptUser=true}
  else if(id==="s-dial"){P.dialect=el.value; saveProfile(); setDialect(P.dialect).then(()=>render()); return}
  else if(id==="s-dev"){ if(el.value==="auto"){DEV={type:null,auto:true}}else{DEV={type:el.value,auto:false}} saveDev(); S.step="scene" }
  else if(id==="s-size")P.size=el.value;
  else if(id==="s-theme")P.theme=el.value;
  else if(id==="s-per")P.perPage=el.value;
  else if(id==="s-rate")P.rate=+el.value;
  else if(id==="s-vol")P.volume=+el.value;
  else if(id==="s-compose"){P.compose=el.value; if(el.value==="pick"&&S.mode==="make"){S.mode="pick";if(S.sel&&S.sel.free)S.sel=null}}
  else if(id==="s-predict")P.predict=+el.value;
  else if(id==="s-kind"){P.inputKind=el.value;S.row=null}
  else if(id==="s-abcl")P.abcLayout=el.value;
  else if(id==="s-vja")P.voiceJa=el.value;
  else if(id==="s-ven")P.voiceEn=el.value;
  else if(id==="s-kana"){P.kana=el.value;S.row=null}
  else if(id==="s-icons")P.icons=el.checked;
  else if(id==="s-confirm")P.confirm=el.checked;
  else return;
  saveProfile(); if(id==="s-per")S.page=0; render();
  const nx=document.getElementById(id); nx&&nx.focus();
});
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(INDEX&&!S.loading){ if(devType()==="phone"&&innerWidth>innerHeight&&S.sel&&!S.panel){S.panel="show"} render()}},150)});

/* ---------- 起動 ---------- */
(async function init(){
  ensureBooks(); render();
  try{
    INDEX=await loadIndex();
    if(!INDEX.roles.find(r=>r.id===P.role)) P.role=INDEX.roles[0].id;
    await loadDialIndex();
    if(P.dialect&&P.dialect!=="std") await setDialect(P.dialect);
    await loadRole(P.role);
    const sc=scenesOf(P.role); S.scene=sc[0]&&sc[0].id; S.loading=false; render();
  }catch(e){S.loading=false;S.err=true;INDEX=INDEX||{roles:[],scenes:[],intents:[]};render()}
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)&&VARIANT==="public"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
