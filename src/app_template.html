<title>ことむすび KOTOMUSUBI{{TITLE_SUFFIX}}</title>
<meta name="description" content="ことばを えらんで つたえる。Words that connect.">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{
  --bg:#f6f8fb; --panel:#ffffff; --ink:#18202b; --sub:#4a5668; --line:#c9d3e0;
  --accent:#1f4e79; --accent-ink:#ffffff; --hot:#b3261e; --ok:#1b6e3c; --focus:#ff9800;
  --tile:#eef4fb; --tile-sel:#d6e6f8; --tile-min:64px;
}
:root{--hdr-bg:var(--accent);--hdr-ink:var(--accent-ink);--sel-bg:var(--accent);--sel-ink:var(--accent-ink);--sel-bd:var(--accent);--attn-bg:#ffeb3b;--attn-ink:#000;--help-bg:#fff;--help-ink:var(--hot)}
:root[data-theme="high"],:root[data-theme="cyan"]{
  --bg:#000; --panel:#000; --ink:#fff; --sub:#d0d0d0; --line:#9a9a9a;
  --hot:#ff8a80; --ok:#69f0ae;
  --tile:#121212; --tile-sel:#262626;
  --accent-ink:#000;
  --hdr-bg:#000; --hdr-ink:#fff; --sel-bg:#262626; --sel-bd:var(--accent); --sel-ink:var(--accent);
  --help-bg:#ff8a80; --help-ink:#000;
}
:root[data-theme="high"]{--accent:#ffd54a;--focus:#00e5ff;--attn-bg:#ffd54a}
:root[data-theme="cyan"]{--accent:#5fd9ee;--focus:#ffd54a;--attn-bg:#5fd9ee}
:root[data-theme="high"] header.top,:root[data-theme="cyan"] header.top{border-bottom:3px solid var(--accent)}
:root[data-theme="high"] .chip[aria-pressed="true"],:root[data-theme="cyan"] .chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--sel-bd)}
*{box-sizing:border-box}
html{font-size:20px}
html[data-size="M"]{font-size:16px}
html[data-size="XL"]{font-size:26px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  line-height:1.5;word-break:auto-phrase;overflow-wrap:break-word;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
ruby rt{font-size:.5em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:flex;flex-direction:column;height:100dvh}
header.top{display:flex;gap:.3rem;align-items:center;padding:.4rem .6rem;background:var(--hdr-bg);color:var(--hdr-ink);flex-wrap:wrap}
header.top h1{font-size:1.05rem;margin:0 .4rem 0 0;white-space:nowrap}
.ver{font-size:.6rem;font-weight:700;margin-left:.4em;padding:.05rem .4rem;border:1px solid currentColor;border-radius:.6rem;vertical-align:middle;white-space:nowrap}
header.top h1 small{font-weight:normal;font-size:.6em;opacity:.85;margin-left:.3em}
.sp{flex:1}
.hbtn{border:2px solid var(--hdr-ink);background:transparent;color:var(--hdr-ink);border-radius:.6rem;padding:.3rem .7rem;min-height:44px;font-weight:600}
.hbtn[aria-pressed="true"],.hbtn[aria-expanded="true"]{background:var(--hdr-ink);color:var(--hdr-bg)}
.hbtn.attn{background:var(--attn-bg);color:var(--attn-ink);border-color:var(--attn-bg)}
.hbtn.help{background:var(--help-bg);color:var(--help-ink);border-color:var(--help-bg)}
main{flex:1;min-height:0;display:grid;gap:.5rem;padding:.5rem}
main.d3{grid-template-columns:minmax(200px,260px) 1fr minmax(280px,380px)}
main.t2l{grid-template-columns:1fr minmax(260px,380px)}
main.t2p{grid-template-rows:auto 1fr}
main.p1{grid-template-columns:1fr;padding:.4rem;padding-bottom:0}
.pane{background:var(--panel);border:2px solid var(--line);border-radius:.8rem;padding:.6rem;overflow:auto;min-height:0}
.pane h2{font-size:.8rem;margin:.2rem 0 .3rem;color:var(--sub);font-weight:700}
.list{display:flex;flex-direction:column;gap:.35rem}
.rb{display:inline-block;position:relative;padding-top:.62em;line-height:1.25;text-indent:0}
.rb>.rt{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:.5em;line-height:1;white-space:nowrap;font-weight:normal;letter-spacing:0}
.simple{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
.sbar{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;background:var(--hdr-bg);color:var(--hdr-ink)}
.sbar .sname{flex:1;text-align:center;font-weight:700;font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{border:2px solid var(--hdr-ink);background:transparent;color:var(--hdr-ink);border-radius:.6rem;padding:.25rem .7rem;min-height:44px;font-weight:600;font-size:.95rem}
.sgrid{flex:1;display:grid;gap:.6rem;padding:.6rem;min-height:0}
.scell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;border:4px solid var(--line);background:var(--tile);border-radius:1.2rem;padding:.4rem;min-height:0;min-width:0;overflow:hidden}
.scell.empty{background:transparent;border-style:dashed;opacity:.35}
.scell.ed{border-style:dashed}
.scell img{flex:1;min-height:0;max-width:100%;object-fit:contain;border-radius:.7rem}
.scell .sdesc{font-size:clamp(.8rem,2vmin,1.2rem);color:var(--sub);text-align:center;line-height:1.2}
.scell .sbadge{position:absolute;right:.5rem;top:.4rem;font-size:clamp(1rem,3vmin,1.8rem)}
label.chk{display:flex;align-items:center;gap:.4rem;min-height:40px;margin-top:.3rem}
.scell .stx{font-size:clamp(1.3rem,4.2vmin,3rem);font-weight:700;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.scell.hit{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent)}
.scell .sdw{position:absolute;left:0;bottom:0;height:10px;width:0;background:var(--focus)}
.scell.dwelling .sdw{width:100%;transition:width var(--dwell) linear}
.sprev{display:flex;align-items:center;justify-content:center;min-height:120px;border:2px dashed var(--line);border-radius:.6rem;margin:.3rem 0;padding:.3rem}
.sprev img{max-width:100%;max-height:220px;border-radius:.5rem}
.scchk{display:flex;flex-wrap:wrap;gap:.2rem .8rem;font-size:.9rem}
.scchk label{display:flex;align-items:center;gap:.25rem;min-height:36px}
.vclip{border:1px solid var(--line);border-radius:.6rem;padding:.4rem .6rem;margin:.4rem 0}
.vclip .vtx{margin:.3rem 0;font-size:1.1rem}
.vchk{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.vchk .btn{min-height:72px;font-size:1.2rem}
.wiz{display:flex;flex-direction:column;gap:.6rem}
.wiz .opt{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;text-align:left;border:2px solid var(--line);background:var(--tile);border-radius:.8rem;padding:.7rem .9rem;font-size:1.1rem;min-height:56px}
.wiz .opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.wiz .opt .ex{font-size:1.05rem;color:var(--ink)}
.wiz .opt .lb{font-weight:700}
.wiz .steps{font-size:.85rem;color:var(--sub)}
.rg{font-size:.95rem;margin:.7rem 0 .25rem;color:var(--sub)}
.hbtn.on{background:var(--hdr-ink);color:var(--hdr-bg)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:2px solid var(--line);background:var(--tile);border-radius:.6rem;padding:.35rem .7rem;min-height:44px;text-align:left}
.chip[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bd);font-weight:700}
.nav{display:flex;flex-direction:column;gap:.6rem}
.grid{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(var(--tile-min)*3.6)),1fr))}
.tile{display:flex;align-items:center;gap:.5rem;min-height:calc(var(--tile-min) + .6rem);border:2px solid var(--line);background:var(--tile);border-radius:.8rem;padding:.5rem .7rem;text-align:left;position:relative}
.tile .ic{font-size:1.6em;flex:none;line-height:1}
.tile .tx{flex:1;min-width:0}
.tile .lv{position:absolute;right:.5rem;top:.2rem;font-size:.55rem;color:var(--sub);letter-spacing:.1em}
.tile .dl{position:absolute;right:.45rem;bottom:.2rem;font-size:.6rem;line-height:1;padding:.1rem .3rem;border:1px solid var(--accent);color:var(--accent);border-radius:.4rem;background:var(--tile)}
.tile .num{position:absolute;left:.4rem;top:.1rem;font-size:.55rem;color:var(--sub)}
.tile[aria-pressed="true"]{background:var(--tile-sel);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.pager{display:flex;gap:.4rem;align-items:center;margin:.5rem 0 0}
.pager .pg{color:var(--sub);flex:1;text-align:center}
.btn{border:2px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:.7rem;padding:.4rem .9rem;min-height:48px;font-weight:700}
:root[data-theme="high"] .btn,:root[data-theme="cyan"] .btn{color:var(--ink);border-color:var(--ink)}
:root[data-theme="high"] .btn.pri,:root[data-theme="cyan"] .btn.pri{background:var(--accent);color:#000;border-color:var(--accent)}
:root[data-theme="high"] .btn.danger,:root[data-theme="cyan"] .btn.danger{color:var(--hot);border-color:var(--hot)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--hot);color:var(--hot)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.small{min-height:40px;padding:.2rem .6rem;font-size:.85rem}
.sentence{font-size:1.6rem;font-weight:700;min-height:6rem;padding:.6rem;border:3px dashed var(--line);border-radius:.8rem;margin:.3rem 0 .6rem;display:flex;gap:.5rem;align-items:center}
.sentence.empty{color:var(--sub);font-weight:400;font-size:1rem}
.sentence .ic{font-size:1.4em;flex:none}
.sentence span{min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.3rem 0}
.row .btn.big{flex:1;font-size:1.2rem;min-height:60px}
.hold{position:relative;overflow:hidden}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--focus)}
.hold.holding::after{width:100%;transition:width var(--hold,800ms) linear}
.note{font-size:.8rem;color:var(--sub)}
.lnk{display:inline-block;margin-top:.3rem;font-size:.85rem;color:var(--pri,#1f4e79);text-decoration:underline}
.warn{border:2px solid var(--hot);border-radius:.6rem;padding:.4rem .6rem;font-size:.85rem}
.bar{display:none}
main.p1 ~ .bar,.bar.on{display:flex;gap:.4rem;padding:.4rem;padding-bottom:calc(.4rem + env(safe-area-inset-bottom));background:var(--panel);border-top:2px solid var(--line)}
.bar .btn{flex:1;min-height:56px;white-space:nowrap;padding:.4rem .3rem;font-size:.85rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:.5rem}
.sheet{min-width:0;background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:1rem;max-width:760px;width:100%;max-height:94dvh;overflow:auto;padding:.8rem}
.sheet h2{margin:.1rem 0 .5rem;font-size:1.1rem}
.sheet .hd{display:flex;align-items:center;gap:.5rem}
.sheet .hd h2{flex:1}
.full{position:fixed;inset:0;z-index:70;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;text-align:center}
.full .big{font-size:min(14vw,6rem);font-weight:800;line-height:1.3}
.full.attn{animation:flash .8s steps(2) infinite}
@keyframes flash{50%{background:#ffeb3b;color:#000}}
@media (prefers-reduced-motion:reduce){.full.attn{animation:none;background:#ffeb3b;color:#000}}
label.f{display:block;margin:.5rem 0 .15rem;font-weight:700;font-size:.85rem}
select,input[type=text],input[type=url],input[type=tel],input[type=email],textarea{font:inherit;width:100%;padding:.4rem .5rem;min-height:44px;border:2px solid var(--line);border-radius:.5rem;background:var(--panel);color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}
.two>*{min-width:0}
@media (max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
details{margin:.5rem 0;border:1px solid var(--line);border-radius:.6rem;padding:.3rem .6rem}
summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.modes{display:flex;gap:.4rem;padding:.3rem .5rem 0;overflow-x:auto;flex-wrap:nowrap}
.modes .chip{white-space:nowrap;flex:none}
@media (max-width:480px){.modes .chip{min-height:40px;padding:.2rem .6rem;font-size:.95rem}}
.board{display:grid;gap:.35rem;margin:.4rem 0}
.board.rtl{direction:rtl}
.board.rtl>*{direction:ltr}
.board.c10{grid-template-columns:repeat(10,minmax(0,1fr))}
.chip.sm{min-height:36px;padding:.15rem .6rem;font-size:.85rem}
.abcb .key{min-height:46px;font-size:1.15rem}
.qrow{display:flex;gap:.35rem;justify-content:center;margin:.35rem 0}
.qrow .key{flex:0 1 calc((100% - 9*.35rem)/10);min-width:0}
.board.c7{grid-template-columns:repeat(7,minmax(0,1fr))}
.board.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.board.fnrow{grid-template-columns:repeat(auto-fit,minmax(3rem,1fr))}
.key{border:2px solid var(--line);background:var(--tile);border-radius:.6rem;min-height:calc(var(--tile-min) - 4px);font-size:1.3rem;font-weight:700}
.key.fn{font-size:.85rem;background:var(--panel)}
textarea#buf{resize:vertical}
.item{display:flex;gap:.3rem;align-items:stretch;margin-bottom:.4rem}
.item .tile{flex:1}
.item .ctl{display:flex;flex-direction:column;gap:.2rem}
@media (max-width:640px){
  header.top{gap:.25rem;padding:.3rem .4rem}
  header.top h1{font-size:.95rem;margin:0}
  header.top h1 small{display:none}
  .hbtn{min-height:44px;padding:.2rem .45rem;font-size:.72rem}
  header.top .sp{display:none}
  .pane{padding:.4rem}
}
#printArea{display:none}
@media print{
  #app,.overlay,.full{display:none!important}
  body{background:#fff;color:#000}
  #printArea{display:block}
  #printArea h1{font-size:14pt;margin:0 0 6mm}
  #printArea .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  #printArea .pc{border:2px solid #000;border-radius:3mm;padding:5mm;min-height:40mm;font-size:18pt;font-weight:700;display:flex;gap:3mm;align-items:center;break-inside:avoid}
  #printArea .pc span.ic{font-size:26pt}
}
</style>
</head>

const t=k=>T[P.lang][k];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KANJI=/([一-鿿々〆ヶ]+)\[([^\]]+)\]/g;
const stripRuby=s=>String(s).replace(/\[[^\]]*\]/g,"");
const readingOf=s=>String(s).replace(KANJI,"$2").replace(/\[[^\]]*\]/g,"");
const rubyHTML=s=>esc(s).replace(KANJI,'<span class="rb">$1<span class="rt">$2</span></span>').replace(/\[[^\]]*\]/g,"");
/* 漢字の学年（学年別漢字配当表 2017 告示・常用漢字） */
const KLV={{KANJI_LEVELS}};
const KSET=(()=>{const m={};KLV.g.forEach((g,i)=>{for(const c of g)m[c]=i+1});for(const c of KLV.j) if(!m[c]) m[c]=7;return m})();
const KMAX={g2:2,g4:4,g6:6,jh:7,all:99};
const kanjiOK=c=>{const g=KSET[c]||(/[々〆ヶ]/.test(c)?1:8); return g<=(KMAX[P.kLevel]||99)};
/* 学年より上の字を含む熟語は、熟語ごとかなにする */
const lvRuby=s=>String(s).replace(KANJI,(m,b,r)=>[...b].every(kanjiOK)?m:r);
const uid=()=>Math.random().toString(36).slice(2,9);

/* 表示：obj は {hira, ruby, en} */
function disp(o){
  if(P.lang==="en") return esc(o.en||stripRuby(o.ruby||o.hira));
  if(P.script==="hira") return esc(o.hira);
  if(P.script==="kanji") return esc(stripRuby(lvRuby(o.ruby)));
  return rubyHTML(lvRuby(o.ruby));
}
function plain(o){
  if(P.lang==="en") return o.en||stripRuby(o.ruby||o.hira);
  if(P.script==="hira") return o.hira;
  return stripRuby(lvRuby(o.ruby));
}
function speakText(o){return P.lang==="en"?(o.en||""):(o.ascii?o.en:o.hira)}

function detectDevice(){
  const coarse=matchMedia("(pointer:coarse)").matches;
  const w=innerWidth,h=innerHeight,m=Math.min(w,h);
  if(coarse) return m<600?"phone":"tablet";
  return w>=1700?"desktop":"laptop";
}
function devType(){return DEV.auto||!DEV.type?detectDevice():DEV.type}
function layoutOf(){
  const d=devType();
  if(d==="phone") return "p1";
  if(d==="tablet") return innerWidth>=innerHeight?"t2l":"t2p";
  return "d3";
}
function perPage(){
  if(P.perPage!=="auto") return +P.perPage;
  const d=devType(); return d==="phone"?4:d==="tablet"?8:12;
}
function tileMin(){const d=devType();return d==="phone"?72:d==="tablet"?96:64}

let INDEX=null; const CACHE={};
async function loadIndex(){
  if(window.__KM) return window.__KM.index;
  const r=await fetch("data/index.json"); if(!r.ok) throw new Error("index"); return r.json();
}
async function loadRole(id){
  if(CACHE[id]) return;
  let j;
  if(window.__KM) j=window.__KM.dicts[id];
  else{const r=await fetch(`data/dict_${id}.json`); if(!r.ok) throw new Error("dict"); j=await r.json()}
  RAW[id]=j.rows; CACHE[id]=hydrate(id);
}
const RAW={}; let DIALIDX=null; const DIAL={id:"std",map:null,rules:null};
const REQUEST_URL="https://github.com/toitoitoi-lab/kotomusubi/issues/new";
const normStd=h=>h.replace(/[\s、。，．！？!?]/g,"");
function hydrate(id){
  return RAW[id].map(r=>{
    const o={id:r[0],scene:r[1],intent:r[2],level:r[3],hira:r[4],ruby:r[5],en:r[6],icon:r[7],sub:r[8]||"",role:id};
    if((DIAL.map||DIAL.rules)&&!isHeavy(o)){
      let d=DIAL.map&&DIAL.map.get(normStd(r[4]));
      if(!d&&DIAL.rules){let t=r[4]; for(const [re,rp] of DIAL.rules) t=t.replace(re,rp); if(t!==r[4]) d=t}
      if(d){o.std=o.hira;o.hira=d;o.ruby=d;o.dial=true}
    }
    return o;
  });
}
async function loadDialIndex(){
  if(DIALIDX) return DIALIDX;
  try{
    if(window.__KM&&window.__KM.dialIndex) DIALIDX=window.__KM.dialIndex;
    else{const r=await fetch("data/dialect_index.json"); DIALIDX=r.ok?await r.json():{regions:[]}}
  }catch(e){DIALIDX={regions:[]}}
  return DIALIDX;
}
async function setDialect(id){
  DIAL.id=id; DIAL.map=null; DIAL.rules=null;
  if(id!=="std"){
    try{
      let j; if(window.__KM&&window.__KM.dialects) j=window.__KM.dialects[id];
      else{const r=await fetch(`data/dialect_${id}.json`); j=r.ok?await r.json():{rows:[]}}
      if(j&&j.rows&&j.rows.length) DIAL.map=new Map(j.rows.map(x=>[normStd(x[0]),x[1]]));
      if(j&&j.rules&&j.rules.length){const rs=[]; j.rules.forEach(x=>{try{rs.push([new RegExp(x[0],"g"),x[1]])}catch(e){}}); if(rs.length) DIAL.rules=rs}
    }catch(e){}
  }
  Object.keys(RAW).forEach(k=>{CACHE[k]=hydrate(k)});
  if(S.sel&&!S.sel.free) S.sel=null;
}

let voices=[];
function refreshVoices(){try{voices=speechSynthesis.getVoices()}catch(e){voices=[]} if(typeof S!=="undefined"&&S.panel==="settings"&&typeof render==="function"&&!document.activeElement.matches("select,input")) render()}
if("speechSynthesis" in window){refreshVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",refreshVoices)}
const ttsOK=()=>"speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
function voiceScore(v){
  const n=(v.name||"").toLowerCase(); let sc=0;
  if(/natural|neural|online|multilingual/.test(n)) sc+=8;
  if(/enhanced|premium|siri|\(premium\)|\(enhanced\)/.test(n)) sc+=7;
  if(/^google/.test(n)) sc+=5;
  if(/^(samantha|alex|daniel|karen|moira|tessa|serena|ava|allison|susan|zira|aria|jenny|guy|kyoko|otoya|nanami|keita|haruka)\b/.test(n)) sc+=5;
  /* ロボット声・かすれ声・効果音声は避ける */
  if(/whisper|fred|ralph|kathy|junior|albert|bruce|vicki|victoria|princess|agnes|eddy|flo\b|grandma|grandpa|rocko|sandy|shelley|reed|bad news|good news|bahh|bells|boing|bubbles|cellos|wobble|jester|organ|superstar|trinoids|zarvox|hysterical|deranged|compact|espeak|novelty/.test(n)) sc-=12;
  if(v.localService===false) sc+=1;
  return sc;
}
function voicesFor(lang){
  const pre=lang.slice(0,2).toLowerCase();
  return voices.filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(pre)).sort((a,b)=>voiceScore(b)-voiceScore(a));
}
function pickVoice(lang){
  const list=voicesFor(lang); const saved=lang.startsWith("en")?P.voiceEn:P.voiceJa;
  if(saved){const v=list.find(v=>v.voiceURI===saved||v.name===saved); if(v) return v}
  const exact=list.filter(v=>v.lang.toLowerCase().replace("_","-")===lang.toLowerCase());
  return (exact[0]&&voiceScore(exact[0])>=voiceScore(list[0])-1?exact[0]:list[0])||null;
}
function speak(e){
  if(!e) return;
  recordUse(e);
  if(!ttsOK()){S.panel="show";S.msg=t("noTTS");render();return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(speakText(e));
    const isE=P.lang==="en"||e.ascii; const lang=isE?"en-US":"ja-JP"; u.lang=lang; u.rate=isE?Math.max(+P.rate,0.95):+P.rate;
    const v=pickVoice(lang); if(v){u.voice=v; u.lang=v.lang}
    u.onstart=()=>{S.speaking=true;render()};
    u.onend=u.onerror=()=>{S.speaking=false;render()};
    S.speaking=true; speechSynthesis.speak(u);
  }catch(err){S.panel="show";S.msg=t("noTTS")}
  render();
}
function testVoice(lang){
  if(!ttsOK()) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(lang==="en"?"Hello. Nice to meet you.":"こんにちは。よろしく おねがいします。");
    const L=lang==="en"?"en-US":"ja-JP"; u.lang=L; u.rate=lang==="en"?Math.max(+P.rate,0.95):+P.rate; const v=pickVoice(L); if(v){u.voice=v;u.lang=v.lang} speechSynthesis.speak(u)}catch(e){}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){} S.speaking=false;render()}
function recordUse(e){
  const key=e.role&&e.id&&!e.fromBook?e.id:(e.fromBook||null);
  if(e.fromBook){const b=BOOKS.find(b=>b.items.some(i=>i.id===e.fromBook));const it=b&&b.items.find(i=>i.id===e.fromBook);if(it){it.count=(it.count||0)+1;saveBooks()}}

function startAttn(){
  S.panel="attn"; render();
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume&&audioCtx.resume();
    const g=audioCtx.createGain(); g.gain.value=[0.25,0.5,0.9][P.volume]||0.5; g.connect(audioCtx.destination);
    let n=0;
    const beep=()=>{
      const o=audioCtx.createOscillator(); o.type="square"; o.frequency.value=n++%2?660:880;
      o.connect(g); o.start(); o.stop(audioCtx.currentTime+0.28);
    };
    beep(); clearInterval(attnTimer); const started=Date.now();
    attnTimer=setInterval(()=>{beep(); if(Date.now()-started>60000) stopAttn()},600);
    window._attnGain=g;
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([300,200,300,200,300]);
}

function csvCell(s){s=String(s??"");return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){
  const rows=[["帖","表示する文","よみ","English","意図","場面"]];

function parseCsv(s){
  s=s.replace(/^﻿/,""); const out=[]; let row=[],cell="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"') q=true;
    else if(c===",") {row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&s[i+1]==="\n") i++; row.push(cell);cell="";out.push(row);row=[] }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);out.push(row)}
  return out.filter(r=>r.some(x=>x!==""));
}
function mergeBooks(incoming,mode){
  if(mode==="replace") BOOKS=[];
  incoming.forEach(nb=>{
    let b=BOOKS.find(x=>x.name===nb.name);
    if(!b){b={id:uid(),name:nb.name,items:[]};BOOKS.push(b)}
    (nb.items||[]).forEach(it=>{
      if(!it.ruby&&!it.hira) return;
      const hira=it.hira||readingOf(it.ruby), ruby=it.ruby||it.hira;
      if(b.items.some(x=>x.hira===hira&&x.ruby===ruby)) return;
      b.items.push({id:uid(),hira,ruby,en:it.en||"",intent:it.intent||"",scene:it.scene||"",icon:it.icon||"💬",count:it.count||0,created:it.created||today()});
    });
  });
  ensureBooks(); saveBooks();
}
async function importFile(file,mode){

      const rows=parseCsv(txt).slice(1); const m={};
      rows.forEach(r=>{const [bn,ruby,hira,en,intent,scene]=r; if(!bn||!ruby) return; (m[bn]=m[bn]||{name:bn,items:[]}).items.push({ruby,hira:hira||readingOf(ruby),en,intent,scene})});
      books=Object.values(m);
    }else{
      const o=JSON.parse(txt); if(o.app!=="kotomusubi") throw new Error("app");
      books=o.kotobacho||[];
      if(o.helpContacts&&Array.isArray(o.helpContacts)&&mode==="replace"){CONTACTS=o.helpContacts;saveContacts()}

}

function cycleChar(c0){
  const c=toHira(c0), kata=c!==c0;
  const r=cycleChar0(c); return r&&kata?toKata(r):r;
}
function cycleChar0(c){
  for(const g of DAKU){const i=g.indexOf(c); if(i>=0&&i<g.length-1) return g[i+1]; if(i===g.length-1) return g[0]}

function cycleLast(kind){
  const c=Math.min(S.caret,S.buf.length); if(c<=0) return;

function smallChar(c0){

}
function sceneExprs(){return (CACHE[P.role]||[]).filter(e=>e.scene===S.scene&&okSub(e))}
function predictions(){
  const n=+P.predict; if(!n||!S.buf.trim()) return [];
  const en=isEn()||isAsciiText(S.buf.trim());
  const key=en?S.buf.trim().toLowerCase().replace(/\s+/g," "):toHira(S.buf.replace(/\s/g,"")); if(!key) return [];
  const seen=new Set(), out=[];
  const pool=[];
  BOOKS.forEach(b=>b.items.forEach(i=>pool.push(i)));
  Object.values(USAGE).forEach(u=>pool.push(u));
  sceneExprs().forEach(e=>pool.push(e));
  for(const e of pool){
    if(en){
      const x=(e.en||"").toLowerCase(); if(!x||x===key||!x.startsWith(key)) continue;
      if(seen.has(x)) continue; seen.add(x); out.push(e); if(out.length>=n) break; continue;
    }
    const h=e.hira.replace(/\s/g,""), k=toHira(stripRuby(e.ruby).replace(/\s/g,""));
    if(h===key||k===key) continue;
    if(!(h.startsWith(key)||k.startsWith(key))) continue;
    if(seen.has(e.hira)) continue; seen.add(e.hira); out.push(e);
    if(out.length>=n) break;
  }
  return out;
}
function tiles(){
  const cnt=new Map();
  if(isAbc()){
    sceneExprs().forEach(e=>{ (e.en||"").replace(/[.,?!]/g,"").split(/\s+/).forEach(w=>{ if(w.length<3) return; const k=w.toLowerCase(); const o=cnt.get(k)||{hira:k,ruby:k,en:k,n:0}; o.n++; cnt.set(k,o)}) });
    return [...cnt.values()].sort((a,b)=>b.n-a.n||a.hira.length-b.hira.length).slice(0,14);
  }
  sceneExprs().forEach(e=>{
    const h=e.hira.split(" "), r=e.ruby.split(" ");
    h.forEach((w,i)=>{ if(w.length<2) return; const o=cnt.get(w)||{hira:w,ruby:r[i]||w,n:0}; o.n++; cnt.set(w,o)});

  return [...cnt.values()].sort((a,b)=>b.n-a.n||a.hira.length-b.hira.length).slice(0,14);
}

  else if(id==="s-rate")P.rate=+el.value;
  else if(id==="s-vol")P.volume=+el.value;
  else if(id==="s-compose"){P.compose=el.value; if(el.value==="pick"&&S.mode==="make"){S.mode="pick";if(S.sel&&S.sel.free)S.sel=null}}
  else if(id==="s-predict")P.predict=+el.value;
  else if(id==="s-kind"){P.inputKind=el.value;S.row=null}
  else if(id==="s-abcl")P.abcLayout=el.value;
  else if(id==="s-vja")P.voiceJa=el.value;
  else if(id==="s-ven")P.voiceEn=el.value;
  else if(id==="s-kana"){P.kana=el.value;S.row=null}
  else if(id==="s-icons")P.icons=el.checked;
  else if(id==="s-confirm")P.confirm=el.checked;
  else return;
  saveProfile(); if(id==="s-per")S.page=0; render();
  const nx=document.getElementById(id); nx&&nx.focus();
});
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{ if(INDEX&&!S.loading){ if(devType()==="phone"&&innerWidth>innerHeight&&S.sel&&!S.panel){S.panel="show"} render()}},150)});

/* ---------- 起動 ---------- */
(async function init(){
  ensureBooks(); render();
  try{
    INDEX=await loadIndex();
    if(!INDEX.roles.find(r=>r.id===P.role)) P.role=INDEX.roles[0].id;
    await loadDialIndex();
    if(P.dialect&&P.dialect!=="std") await setDialect(P.dialect);
    await loadRole(P.role);
    const sc=scenesOf(P.role); S.scene=sc[0]&&sc[0].id; S.loading=false; if(P.lastSimple){S.mode="simple"; loadBoardImgs()} render();
  }catch(e){S.loading=false;S.err=true;INDEX=INDEX||{roles:[],scenes:[],intents:[]};render()}
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)&&VARIANT==="public"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
